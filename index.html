  const filled = INPUT_ORDER.filter(k=>inp[k]!=null && (Array.isArray(inp[k])?inp[k].length:String(inp[k]).trim()));
  const val = k => Array.isArray(inp[k]) ? inp[k].join(', ') : (inp[k]||'');
  return `<details class="card pad mt16" style="background:var(--surface-2);box-shadow:none" ${filled.length?'open':''}>
    <summary class="spread" style="cursor:pointer;gap:10px"><b class="small">Teacher inputs</b>
      <span class="xs muted">${filled.length ? filled.length+' set' : 'Optional · from the district Input Form'}</span></summary>
    <p class="xs muted mt8">Anything left blank is generated. What you set here overrides the defaults the next time the week is written.</p>
    <div class="grid2 mt12" style="gap:12px">
      ${INPUT_ORDER.map(k=>`<div><label class="lbl" for="inp-${k}">${esc(INPUT_LABELS[k])}${k==='vocabulary'?' <span class="muted2" style="font-weight:400">— up to 10, comma separated</span>':k==='clusters'?' <span class="muted2" style="font-weight:400">— up to 3</span>':''}</label>
        ${k==='readingLevel'
          ? `<select class="field" id="inp-${k}" data-inp="${k}" ${ed?'':'disabled'}><option value="">Grades 9–10 · district default</option>${READING_LEVELS.filter(l=>l!=='Grades 9–10').concat(val(k)&&!READING_LEVELS.includes(val(k))?[val(k)]:[]).map(l=>`<option ${val(k)===l?'selected':''}>${esc(l)}</option>`).join('')}</select>`
          : ['scenarioIdea','notes','accessibility','differentiation','examples'].includes(k)
          ? `<textarea class="field" id="inp-${k}" data-inp="${k}" rows="2" ${ed?'':'disabled'}>${esc(val(k))}</textarea>`
          : `<input class="field" id="inp-${k}" data-inp="${k}" value="${esc(val(k))}" ${ed?'':'disabled'}>`}</div>`).join('')}
    </div>
  </details>`;
}
function bindInputs(c){
  $$('[data-inp]').forEach(f=> f.onchange = ()=>{
    const k=f.dataset.inp, v=f.value.trim(); c.inputs = c.inputs||{};
    if(!v) delete c.inputs[k];
    else if(k==='vocabulary') c.inputs[k] = v.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).slice(0,10);
    else if(k==='clusters') c.inputs[k] = v.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).slice(0,3);
    else c.inputs[k] = v;
    if(k==='video' && c.content && c.content.teacherNotes) c.content.teacherNotes.instructorVideo = v;
    c.updatedAt = nowISO(); persist();
    if(k==='video' || k==='readingLevel') render();
  });
}

/* The Credential Lesson as a document (Gem 3.25 order, formatted for Google
   Docs): header, Essential Question, Activating Strategy, Teaching Strategy
   with reading, vocabulary, both assessments and the Instructor Answer Key,
   Extending and Refining with the rubric, Summarizing. Options carry no
   letters (3.11, 3.12); the key gives the answer text. */
// Google Forms: paste the question into the title, then the option lines into the first option — Forms splits lines into separate options.
function quizFormsText(d){
  const one = (name, list) => `${name}\n\n` + (list||[]).map((q,i)=>`${i+1}. ${q.stem||''}\n${(q.o||[]).join('\n')}\nCorrect answer: ${(q.o||[])[q.a]||''}`).join('\n\n');
  return one('Vocabulary Assessment', d.vocabQuiz) + '\n\n\n' + one('Content Assessment', d.contentQuiz);
}
function lessonDoc(c){
  const d = c.content, h = weekHeader(c), e = d.extending||{}, sm = d.summarizing||{};
  const H = (n,t)=>`<h${n}>${esc(t)}</h${n}>`, P = t=> t?`<p>${esc(t)}</p>`:'', UL = a=>(a||[]).length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'', OL = a=>(a||[]).length?`<ol>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'';
  const vterms = (d.vocabulary||[]).map(v=>v.term), used = new Set();
  const vis = v => { const k=(VISUAL_KINDS.find(x=>x.id===v.kind)||{name:v.kind}).name;
    if(v.kind==='table' && (v.items||[]).length){ const rows=v.items.map(r=>String(r).split('|').map(x=>x.trim()));
      return `<p><b>${esc(k)}${v.title?' — '+esc(v.title):''}</b></p><table border="1" cellpadding="4">${rows.map((r,i)=>`<tr>${r.map(x=>i?`<td>${esc(x)}</td>`:`<th>${esc(x)}</th>`).join('')}</tr>`).join('')}</table>`; }
    return `<p><b>${esc(k)}${v.title?' — '+esc(v.title):''}.</b> ${esc(v.body||'')}</p>${v.kind==='quickcheck'?((v.items||[])[0]?`<p><i>Answer: ${esc(v.items[0])}</i></p>`:''):(v.kind==='steps'||v.kind==='flow'?OL(v.items):UL(v.items))}`; };
  const quiz = list => (list||[]).map((q,i)=>`<p><b>${i+1}. ${esc(q.stem||'')}</b></p>${UL(q.o)}`).join('');
  const key = list => `<ol>${(list||[]).map(q=>`<li>${esc((q.o||[])[q.a]||'')}</li>`).join('')}</ol>`;
  const rub = (e.rubric||[])[0] && e.rubric[0].criterion
    ? `<table border="1" cellpadding="4"><tr><th>Performance Level</th>${RUBRIC_LEVELS.map(l=>`<th>${esc(l)}</th>`).join('')}</tr>${e.rubric.map(r=>`<tr><th>${esc(r.criterion)}</th>${(r.levels||[]).map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table>`
    : UL((e.rubric||[]).map(r=>`${r.level}: ${r.desc}`));
  const html = [
    H(1,'Credential Lesson'),
    `<p>${[['Credential Name',h.credential],['Course Name',h.course],['Module Name',h.module],['Week Number',h.week],['Topic',d.topic||d.title],['Estimated Completion Time',`About ${weekMinutesOf(c)} minutes`]].map(([k,v])=>`<b>${k}:</b> ${esc(v!=null?String(v):'')}`).join('<br>')}</p>`,
    H(3,'Learning Objectives'), OL(d.objectives),
    H(2,'Essential Question'), P(d.essentialQuestion),
    H(2,'Activating Strategy'), P((d.activating||{}).scenario), `<p><b>Before you learn this:</b> ${esc((d.activating||{}).prompt||'')}</p>`,
    H(2,'Teaching Strategy'), H(3,(d.reading||{}).title||'Technical Reading'),
    ((d.reading||{}).sections||[]).map(sec=>H(4,sec.heading||'')+`<p>${boldTermsOnce(sec.body, vterms, used)}</p>`+(sec.visuals||[]).map(vis).join('')).join(''),
    (c.inputs||{}).video ? `<p><b>Video:</b> ${esc(c.inputs.video)}</p>` : '',
    H(3,'Vocabulary'), `<ul>${(d.vocabulary||[]).map(v=>`<li><b>${esc(v.term||'')}</b> — ${esc(v.def||'')}</li>`).join('')}</ul>`,
    H(3,'Vocabulary Assessment'), quiz(d.vocabQuiz),
    H(3,'Content Assessment'), quiz(d.contentQuiz),
    H(3,'Instructor Answer Key'), '<p><b>Vocabulary Assessment</b></p>'+key(d.vocabQuiz)+'<p><b>Content Assessment</b></p>'+key(d.contentQuiz),
    H(2,'Extending and Refining'), P(e.purpose), e.objective?`<p><b>Objective:</b> ${esc(e.objective)}</p>`:'', e.task?`<p><b>Student task:</b> ${esc(e.task)}</p>`:'',
    (e.materials||[]).length?H(4,'What you need')+UL(e.materials):'', H(4,'Directions'), OL(e.steps),
    e.submit?`<p><b>What to submit:</b> ${esc(e.submit)}</p>`:'', H(4,'Success criteria'), UL(e.success), H(4,'Common mistakes'), UL(e.mistakes),
    `<p><b>Estimated time:</b> about ${esc(String(e.minutes||60))} minutes</p>`, H(4,'Performance Rubric'), rub,
    H(2,'Summarizing'), sm.activity&&sm.activity.instructions?`<p><b>${esc(sm.activity.name||'')}:</b> ${esc(sm.activity.instructions)}</p>${OL(sm.activity.items)}`:'',
    H(4,'Reflection Post'), (sm.steps||[]).map((st,i)=>`<p><b>${esc((REFLECTION_STEPS.find(x=>x.id===st.id)||REFLECTION_STEPS[i]||{}).name||'')}${st.id==='apply'&&sm.strategy?' — '+esc(sm.strategy):''}</b><br>${esc(st.prompt||'')}</p>`).join(''),
    sm.openQuestion?`<p><i>${esc(sm.openQuestion)}</i></p>`:'',
    H(4,`Peer Responses — respond to ${(sm.peer||{}).count||2} classmates`), UL((sm.peer||{}).rules||PEER_RULES)
  ].join('\n');
  const tmp = document.createElement('div'); tmp.innerHTML = html.replace(/<\/(p|h\d|li|tr)>/g,'$&\n').replace(/<br>/g,'\n');
  return { html, text: tmp.innerText.replace(/\n{3,}/g,'\n\n').trim() };
}
async function copyRich(doc, okMsg){
  try{
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([doc.html],{type:'text/html'}), 'text/plain': new Blob([doc.text],{type:'text/plain'}) })]);
    } else await navigator.clipboard.writeText(doc.text);
    toast(okMsg);
  }catch(e){
    modal(`<div><h2>Copy it</h2><p class="small muted mt8">Select all, copy, and paste into Google Docs.</p><textarea class="field mt12" rows="14">${esc(doc.text)}</textarea><div class="actbar"><button class="btn" data-close>Close</button></div></div>`);
  }
}

/* =========================================================
   THE TEACHER'S PLANNING FORM, AND THE WEEK'S BINDINGS
   ---------------------------------------------------------
   The second output: the district's Acquisition Lesson Planning
   Form, in its sections and its order, summarised rather than
   reproduced and with no grading detail. It exists to be copied
   into their own document with no editing.
   ========================================================= */

function weekPlan(c){
  const d = c.content, pl = d.plan || {};
  const stds = (pl.standards||[]).map(x=>{
    const known = standardByCode(x.code);
    return { code: known?known.code:(x.code||''), desc: x.desc || (known?known.desc:''), known: !!known, drafted: !!(known && known.status==='drafted') };
  });
  const sec = (name, body) => `<div class="divider"></div>
    <b class="small" style="text-transform:uppercase;letter-spacing:.06em">${esc(name)}</b>
    <div class="mt12">${body}</div>`;
  return `<div class="card pad-lg anim-up">
    <span class="pill violet">${ic('doc')} Acquisition Lesson Planning Form</span>
    <h1 class="mt12">${esc(d.title||'')}</h1>
    <div class="row gap mt12" style="gap:8px"><button class="btn sm" data-plancopy>${ic('doc')} Copy for Google Docs</button></div>
    <p class="xs muted2 mt8">Summaries only. The student-facing detail stays in the Credential Lesson.</p>

    ${sec('Plan for the Concept, Topic, or Skill', `<p class="contentbox">${ED('plan.concept', pl.concept, 4)}</p>`)}
    ${sec('Learning Objectives', `<ul class="num-list">${(d.objectives||[]).map((o,i)=>`<li>${ED('objectives.'+i, o, 2)}</li>`).join('')}</ul>`)}
    ${sec('Essential Question', `<p class="contentbox">${ED('essentialQuestion', d.essentialQuestion, 2)}</p>`)}
    ${sec('Activating Strategies', `<p class="contentbox">${ED('plan.activating', pl.activating, 3)}</p>`)}
    ${sec('Acceleration / Previewing — Key Vocabulary',
      `<div style="display:grid;gap:7px">${(d.vocabulary||[]).map(v=>
        `<div class="small"><b>${esc(v.term||'')}</b> — ${esc(v.def||'')}</div>`).join('')}</div>`)}
    ${sec('Teaching Strategies', `<p class="contentbox">${ED('plan.teaching', pl.teaching, 4)}</p>
      <b class="small mt20" style="display:block">New York State Standards</b>
      ${stds.length?`<div class="mt12" style="display:grid;gap:8px">
        ${stds.map((x,i)=>`<div class="row gap" style="gap:10px;align-items:flex-start">
          <span class="pill ${x.known && !x.drafted?'':'rose'}" style="flex:none" title="${x.drafted?'Drafted — not yet checked against the source':x.known?'':'Not in the standards list'}">${esc(x.code)}${x.drafted?' · drafted':''}</span>
          <span class="small grow">${ED('plan.standards.'+i+'.desc', x.desc, 2)}</span></div>`).join('')}
      </div>`:`<div class="xs muted mt8">${standardsOf('state').length ? 'None returned.' : 'Waiting for the district’s NYS Next Generation documents (Settings → Standards). CDOS is in Teacher Notes.'}</div>`}`)}
    ${sec('Extending / Refining Activity', `<p class="contentbox">${ED('plan.extending', pl.extending, 3)}</p>`)}
    ${sec('Summarizing Strategies', `<p class="contentbox">${ED('plan.summarizing', pl.summarizing, 3)}</p>`)}
  </div>
  ${S.editing ? '' : teacherNotesBlock(c)}`;
}

/* The form as plain text, in the district's order, for pasting into their own document. */
function planText(c){
  const d=c.content, pl=d.plan||{};
  const sec=(h,b)=>`${h.toUpperCase()}\n${b}\n`;
  return [
    `ACQUISITION LESSON PLANNING FORM — ${d.title||''}\n`,
    sec('Plan for the Concept, Topic, or Skill', pl.concept||''),
    sec('Learning Objectives', (d.objectives||[]).map((o,i)=>`${i+1}. ${o}`).join('\n')),
    sec('Essential Question', d.essentialQuestion||''),
    sec('Activating Strategies', pl.activating||''),
    sec('Acceleration / Previewing — Key Vocabulary', (d.vocabulary||[]).map(v=>`${v.term} — ${v.def}`).join('\n')),
    sec('Teaching Strategies', (pl.teaching||'') + '\n\nNew York State Standards\n' + ((pl.standards||[]).length ? pl.standards.map(x=>`${x.code} — ${x.desc}`).join('\n') : 'To be added from the district’s NYS Next Generation documents.')),
    sec('Extending / Refining Activity', pl.extending||''),
    sec('Summarizing Strategies', pl.summarizing||'')
  ].join('\n');
}

/* ---------- bindings for a nano ---------- */
function bindNano(){
  const c = CRED(S.openId); if(!c) return;
  bindCredCommon(c);
  bindInputs(c);
  $$('[data-openup]').forEach(b=> b.onclick = ()=> openCred(b.dataset.openup));
  $$('[data-wpart]').forEach(b=> b.onclick = ()=> partModal(c, b.dataset.wpart));
  $$('[data-wsrcdel]').forEach(b=> b.onclick = ()=>{ (c.moreSources||[]).splice(+b.dataset.wsrcdel,1); c.updatedAt=nowISO(); render(); });
  const sa=$('[data-wsrcadd]'); if(sa) sa.onclick = ()=> modal(`<div><h2>Add another document</h2>
      <p class="small muted mt8">It is read together with the main source. Where they disagree, the main source wins.</p>
      <div class="drop mt16"><div class="ico">${ic('doc')}</div><b class="mt12" style="display:block">Drop a document here</b>

        <button class="btn sm mt12" data-mpick>Choose a file</button><input type="file" id="mfile" accept=".txt,.md,.pdf,.docx" style="display:none"></div>
      <label class="lbl mt16" for="mtext">Or paste it</label><textarea class="field" id="mtext" rows="6"></textarea>
      <div class="actbar"><button class="btn" data-close>Cancel</button><button class="btn primary" data-madd>Add</button></div></div>`,
    { after:(m,close)=>{
      const add = src=>{ c.moreSources = (c.moreSources||[]).concat([src]); c.updatedAt=nowISO(); close(); toast('Document added'); render(); };
      const f=$('#mfile',m); $('[data-mpick]',m).onclick=()=>f.click();
      const take = file => readSourceFile(file).then(add).catch(e=>toast(esc(e.message||'Could not read that file')));
      f.onchange=()=>{ if(f.files[0]) take(f.files[0]); }; bindDrop($('.drop',m), take);
      $('[data-madd]',m).onclick=()=>{ const t=$('#mtext',m).value.trim(); if(wordCount(t)<20){ toast('Paste at least 20 words'); return; } add({ name:'Pasted document', kind:'Text', text:t }); };
    } });
  const lcp=$('[data-lessoncopy]'); if(lcp) lcp.onclick = ()=> copyRich(lessonDoc(c), 'Credential Lesson copied — paste into Google Docs');
  const qcp=$('[data-quizcopy]'); if(qcp) qcp.onclick = ()=>{ const t=quizFormsText(c.content); copyRich({html:esc(t).replace(/\n/g,'<br>'), text:t}, 'Quizzes copied — paste each question and its options into Google Forms'); };
  const ncp=$('[data-notescopy]'); if(ncp) ncp.onclick = ()=> copyRich(teacherNotesDoc(c), 'Teacher Notes copied — paste into Google Docs');
  const pc=$('[data-wpacing]'); if(pc) pc.onchange = ()=>{ c.pacing = pc.checked; c.updatedAt=nowISO(); persist(); render(); };
  const vg=$('[data-wvideogen]'); if(vg) vg.onchange = ()=>{
    c.videoGen = vg.checked; c.updatedAt=nowISO();
    if(c.content){
      if(vg.checked && !(c.content.video && (c.content.video.scenes||[]).length)){ if(aiLive()){ generatePart(c.id,'video'); return; } toast('Writing is unavailable right now — the video will be written next time.'); }
      c.content.videoOn = vg.checked && !!(c.content.video && (c.content.video.scenes||[]).length);
    }
    persist(); render(); };
  const rcp=$('[data-rubriccopy]');
  if(rcp) rcp.onclick = ()=>{ const t = rubricTSV((c.content.extending||{}).rubric);
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(()=>toast('Rubric copied — paste into Google Sheets'), ()=>{ modal(`<div><h2>Copy the rubric</h2><p class="small muted mt8">Select all and copy, then paste into Google Sheets.</p><textarea class="field mt12" rows="10">${esc(t)}</textarea><div class="actbar"><button class="btn" data-close>Close</button></div></div>`); }); };
  const rc=$('[data-wrecheck]');
  if(rc) rc.onclick = async ()=>{
    rc.disabled = true; rc.textContent = 'Checking…';
    await probeProxy(); render();
  };
  const hm=$('[data-whome]');
  if(hm) hm.onchange = ()=>{ c.subCluster = hm.value || null; c.updatedAt=nowISO(); render(); };
  const sd=$('[data-wstrand]');
  if(sd) sd.onchange = ()=>{ c.strand = sd.value; c.updatedAt=nowISO(); render(); };
  $$('[data-wpick]').forEach(sel=> sel.onchange = ()=>{
    c.strategies[sel.dataset.wpick] = sel.value; c.updatedAt=nowISO();
    if(c.content) toast('Saved. The week keeps its current content until you rewrite it.');
    render(); });
  $$('[data-wtab]').forEach(b=> b.onclick = ()=>{
    if(S.editing) saveEdits(c);
    S.weekTab=b.dataset.wtab; S.editing=false; render(); });
  $$('[data-wstudent]').forEach(b=> b.onclick = ()=>{
    if(S.editing){ saveEdits(c); S.editing=false; }
    S.studentView = !S.studentView; S.previewSeed = 1 + Math.floor(Math.random()*900); render(); });
  const rs=$('[data-wreseed]'); if(rs) rs.onclick = ()=>{ S.previewSeed=(S.previewSeed||0)+1+Math.floor(Math.random()*40); render(); };
  const pl=$('[data-wplay]'); if(pl) pl.onclick = ()=> playVideo((S.studentView?studentContent(c):c.content).video);
  $$('[data-qpick]').forEach(b=> b.onclick = ()=>{ const st=QUIZ[b.dataset.qpick]; if(!st||st.checked) return;
    st.picks[+b.dataset.q] = +b.dataset.o; render(); });
  $$('[data-qcheck]').forEach(b=> b.onclick = ()=>{ const st=QUIZ[b.dataset.qcheck]; if(!st) return;
    if(st.checked){ st.checked=false; st.picks={}; } else st.checked=true; render(); });
  const cp=$('[data-plancopy]'); if(cp) cp.onclick = ()=>{
    const t = planText(c);
    const html = t.split('\n\n').map(b=>{ const [h,...rest]=b.split('\n'); return /^[A-Z][A-Z /—,&-]+$/.test(h)
      ? `<h3>${esc(h)}</h3>${rest.map(x=>`<p>${esc(x)}</p>`).join('')}` : b.split('\n').map(x=>`<p>${esc(x)}</p>`).join(''); }).join('');
    copyRich({ html, text:t }, 'Planning form copied — paste into Google Docs');
  };
  const cx=$('[data-wcancel]'); if(cx) cx.onclick = ()=>{ S.editing=false; toast('Changes discarded'); render(); };

  const g=$('[data-wgen]');   if(g) g.onclick = ()=> generateWeek(c.id);
  $$('[data-wregen]').forEach(rg=> rg.onclick = ()=> modal(`<div>
      <h2>Regenerate this week?</h2>
      <p class="small muted mt8" style="max-width:52ch">The current version is kept and you can restore it.
        Nothing is lost${usedBy(c.id).length>1?`, but this week sits inside ${usedBy(c.id).length} credentials
        and they will all show the new version`:''}.</p>
      <div class="actbar"><button class="btn" data-close>Keep it</button>
        <button class="btn primary" data-rgyes>Regenerate</button></div></div>`,
    { after:(m,close)=>{ const y=$('[data-rgyes]',m); if(y) y.onclick=()=>{ close(); generateWeek(c.id); }; } }));

  const ed=$('[data-wedit]');
  if(ed) ed.onclick = ()=>{
    if(S.editing) saveEdits(c);
    S.editing = !S.editing; render();
  };
  $$('[data-wrestore]').forEach(b=> b.onclick = ()=>{
    const i = +b.dataset.wrestore, v = (c.revisions||[])[i];
    if(!v) return;
    pushRevision(c, 'restored', c.content);
    c.content = JSON.parse(JSON.stringify(v.content));
    if(c.title) c.content.title = c.title;   // the name stays; the content goes back
    c.updatedAt = c.contentAt = nowISO();
    toast('Restored'); render();
  });
  const src=$('[data-wsource]');
  if(src) src.onclick = ()=>{
    S.srcTab = null; S.srcBrief = null;
    modal(sourceModal(c), { after:m=>bindSourceModal(m,c), onClose:()=>{ S.srcTab=null; S.srcBrief=null; } });
  };
}

/* Editing writes into the content by path. Three kinds of field: text,
   a list written one item per line, and a number (the right answer). The
   version before the edit is kept, so nothing an edit replaces is lost. */
function saveEdits(c){
  const before = JSON.parse(JSON.stringify(c.content));
  let touched = 0;
  const put = (path, v)=>{ if(JSON.stringify(getByPath(c.content, path)) !== JSON.stringify(v)){ setByPath(c.content, path, v); touched++; } };
  $$('[data-edit]').forEach(t=> put(t.dataset.edit, t.value));
  $$('[data-editlines]').forEach(t=> put(t.dataset.editlines, t.value.split('\n').map(x=>x.trim()).filter(Boolean)));
  $$('[data-editnum]').forEach(t=> put(t.dataset.editnum, +t.value));
  if(touched){
    const now = c.content; c.content = before;
    pushRevision(c, 'edited', now);
    c.content = now;
    c.updatedAt = c.contentAt = nowISO();
    // One week, one name: the lesson heading is the credential's title.
    if(String(c.content.title||'').trim() && c.content.title.trim() !== c.title){ c.title = c.content.title.trim(); c.titleAuto = false; }
    toast(`${touched} change${touched===1?'':'s'} saved`);
  }
}
function getByPath(o, path){
  return path.split('.').reduce((a,k)=> a==null?a:a[k], o);
}
function setByPath(o, path, v){
  const ks = path.split('.'); const last = ks.pop();
  const t = ks.reduce((a,k)=> a[k], o);
  if(t) t[last] = v;
}

/* The same three routes as creation. A week added to a container later must
   not be stuck with a worse set of options than one created on its own. */
function sourceModal(c){

    ${tab==='file'?`<div class="drop mt16">
      <div class="ico">${ic('doc')}</div>
      <b class="mt12" style="display:block">Drop a document here</b>
      <div class="xs muted mt4">PDF, Word (.docx) or plain text, up to 25 MB.</div>
      <button class="btn sm mt12" data-spick>Choose a file</button>
      <input type="file" id="sfile" accept=".txt,.md,.pdf,.docx" style="display:none">

      placeholder="Paste the document">${esc(c.source&&c.source.kind!=='Brief'?(c.source.text||''):'')}</textarea>`:''}

    ${tab==='brief' ? briefForm(S.srcBrief, sub) : ''}

    <div class="actbar"><button class="btn" data-close>Cancel</button>

function bindSourceModal(m, c){
  /* Re-opening must not go through Cancel, which would throw away the brief
     the teacher is half way through writing. */
  const reopen = ()=>{
    if(m.parentElement) m.parentElement.remove();
    modal(sourceModal(c), { after:mm=>bindSourceModal(mm,c), onClose:()=>{ S.srcTab=null; S.srcBrief=null; } });
  };
  $$('[data-stab]', m).forEach(b=> b.onclick = ()=>{ S.srcTab = b.dataset.stab; reopen(); });

  let pending = null;
  bindBriefForm(m, S.srcBrief, subCluster(c.subCluster), src=>{ pending = src; }, reopen);

  const pick=$('[data-spick]',m), file=$('#sfile',m);
  if(pick && file) pick.onclick = ()=> file.click();
  const take = f => readSourceFile(f).then(src=>{
    c.source = src; c.updatedAt=nowISO(); S.srcTab=null; S.srcBrief=null;
    m.parentElement && m.parentElement.remove(); toast('Source saved'); render();
  }).catch(e=> toast(esc(e.message||'Could not read that file')));
  if(file) file.onchange = ()=>{ const f=file.files[0]; if(f) take(f); };
  bindDrop($('.drop',m), take);

  const b=$('[data-srcsave]',m);
  if(b) b.onclick = ()=>{
    const tab = S.srcTab || (c.source && c.source.kind==='Brief' ? 'brief' : 'paste');
    if(tab==='brief'){
      const src = pending || briefToSource(S.srcBrief, subCluster(c.subCluster));
      if(!src){ toast(S.srcBrief.partner
        ? 'A brief for an employer needs a topic and the organisation'
        : 'A brief needs a topic and a home sub-cluster'); return; }
      c.source = src;
    } else {
      const t = ($('#srctext',m)&&$('#srctext',m).value)||'';
      c.source = t.trim() ? { name:(c.source&&c.source.kind!=='Brief'&&c.source.name)||'Pasted text', kind:'Text', text:t } : null;
    }
    c.updatedAt = nowISO(); S.srcTab=null; S.srcBrief=null;
    const cl=$('[data-close]',m); if(cl) cl.click();
    toast('Source saved'); render();
  };
}

/* =========================================================
   CUMULATIVE ASSESSMENT, AND THE BADGE'S STRAND PLAN
   ========================================================= */
/* Every week beneath a container, in order, each once — a macro's
   cumulative draws on the ten weeks of its two micros, not on the micros. */
function weeksBeneath(c, seen){
  seen = seen || new Set();
  const out = [];
  childrenOf(c).forEach(k=>{
    if(k.level==='nano'){ if(!seen.has(k.id)){ seen.add(k.id); out.push(k); } }
    else out.push(...weeksBeneath(k, seen));
  });
  return out;
}
const CUMULATIVE_COUNT = { micro:12, macro:16, meta:20, badge:24 };
/* The assessment is built from particular versions of particular weeks. If
   a week is rewritten, added or removed afterwards it no longer matches. */
function cumulativeBasis(c){ return weeksBeneath(c).map(k=>k.id+'@'+(k.contentAt||'')).join('|'); }
const cumulativeStale = c => !!(c.cumulative && c.cumulative.basis !== cumulativeBasis(c));

async function generateCumulative(credId){
  const c = CRED(credId); if(!c || S.busy) return;
  const weeks = weeksBeneath(c);
  if(!weeks.length || weeks.some(k=>!k.content)) return;
  const n = CUMULATIVE_COUNT[c.level] || 12;
  busyStart('Building the cumulative assessment');
  try{
    const digest = weeks.map((k,i)=>`WEEK ${i+1}: ${k.content.title}
Essential question: ${k.content.essentialQuestion}
Covered: ${(k.content.objectives||[]).join('; ')}
Vocabulary: ${(k.content.vocabulary||[]).map(v=>v.term).join(', ')}`).join('\n\n');
    const raw = await callModel({
      system: SYS_WEEK,
      maxTokens: 8000,
      user:
`These ${weeks.length} weeks make up the ${LEVEL(c.level).label} "${c.title}".

${digest}

Write the cumulative assessment a student answers to earn the whole credential. It teaches nothing
new: every question must be answerable from what these weeks already covered, and each must draw on
a named week. Spread it across all the weeks.

Return JSON only:
{ "questions": [ { "stem": "", "o": ["","","",""], "a": 0, "why": "", "from": "WEEK n: title — or two weeks for a combining question" } ] }

Exactly ${n} questions. At least ${Math.max(2,Math.round(n/5))} must require combining material from more than one week —
say so in "from". Wrong options plausible to somebody who half-learned it.`
    });
    const j = extractJSON(raw);
    const valid = q => q && q.stem && Array.isArray(q.o) && q.o.length===4 && Number.isInteger(q.a) && q.a>=0 && q.a<4;
    if(!j || !(j.questions||[]).filter(valid).length) throw new Error('The assessment came back unreadable. Nothing was changed.');
    j.questions = j.questions.filter(valid);
    if(j.questions.length < n){
      busyStage('Adding the missing questions');
      const more = extractJSON(await callModel({ system: SYS_WEEK, maxTokens: 4000, user:
`${digest}

These questions already exist:
${j.questions.map((q,i)=>`${i+1}. ${q.stem}`).join('\n')}

Write ${n-j.questions.length} more, different from these, same rules: answerable from the weeks, each naming its week in "from".
Return JSON only: { "questions": [ { "stem": "", "o": ["","","",""], "a": 0, "why": "", "from": "" } ] }` }));
      j.questions = j.questions.concat(((more||{}).questions||[]).filter(valid));
    }
    j.questions = j.questions.slice(0, n);
    // Combining questions are what make it cumulative: enforce the minimum, replacing
    // single-week questions from whichever week has the most.
    const need = Math.max(2,Math.round(n/5));
    const weeksOf = q => (String(q.from||'').match(/WEEK\s*\d+/gi)||[]).map(w=>w.toUpperCase().replace(/WEEK\s*/,'WEEK '));
    const isMulti = q => new Set(weeksOf(q)).size > 1;
    const have = j.questions.filter(isMulti).length;
    if(have < need){
      busyStage('Adding questions that combine weeks');
      const more = extractJSON(await callModel({ system: SYS_WEEK, maxTokens: 3000, user:
`${digest}

Write ${need-have} question${need-have>1?'s':''} that can only be answered by combining what two different weeks above taught.
Name both weeks in "from", e.g. "WEEK 1 + WEEK 3". Answerable from the weeks; nothing new.
Return JSON only: { "questions": [ { "stem": "", "o": ["","","",""], "a": 0, "why": "", "from": "" } ] }` }));
      const add = ((more||{}).questions||[]).filter(q=>valid(q) && isMulti(q)).slice(0, need-have);
      add.forEach(q=>{
        const tally = {}; j.questions.forEach(x=>{ if(!isMulti(x)) weeksOf(x).forEach(w=>tally[w]=(tally[w]||0)+1); });
        const top = Object.keys(tally).sort((a,b)=>tally[b]-tally[a])[0];
        let idx = -1; for(let i=j.questions.length-1;i>=0;i--){ const x=j.questions[i]; if(!isMulti(x) && weeksOf(x).includes(top)){ idx=i; break; } }
        if(idx>=0) j.questions[idx] = q; else if(j.questions.length < n) j.questions.push(q);
      });
    }
    spreadKeys(j.questions); j.keysSpread = true;
    j.basis = cumulativeBasis(c); j.builtAt = nowISO();
    c.cumulative = j; c.updatedAt = nowISO();
    toast(`${j.questions.length} questions across ${weeks.length} weeks`);
  }catch(e){ toast(esc(e.message||'Could not build it')); }
  busyEnd();
}

/* The week-by-week sequence is the plan teachers build from, so strand
   totals are always taken from it (a strand the sequence uses but the list
   forgot is added). Also applied to plans saved before this rule. */
function reconcileBadgePlan(j){
  if(!j || (j.sequence||[]).length!==30) return j;
  const n = {}; j.sequence.forEach((w,i)=>{ w.week=i+1; n[w.strand]=(n[w.strand]||0)+1; });
  j.strands = j.strands || [];
  j.strands.forEach(s=>{ s.weeks = n[s.subject]||0; });
  Object.keys(n).forEach(k=>{ if(!j.strands.some(s=>s.subject===k)) j.strands.push({ subject:k, weeks:n[k], emphasis:'', why:'' }); });
  return j;
}
async function generateBadgePlan(credId){
  const c = CRED(credId); if(!c || c.level!=='badge' || S.busy) return;
  const sub = subCluster(c.subCluster) || { name:c.subCluster||'', careers:[], desc:'' };
  busyStart(`Planning thirty weeks for ${sub.name}`);
  try{
    const raw = await callModel({
      maxTokens: 9000,
      system: SYS_WEEK + `

You are planning a thirty-week Career Badge: a single sub-cluster studied for thirty weeks with the
four core academic subjects taught inside it rather than alongside it. The ratio between subjects
must follow what the career genuinely demands, and you must be able to defend it to a curriculum
director.`,
      user:
`Sub-cluster: ${sub.name}
Cluster: ${clusterOf(sub.name)||''}
What it covers: ${sub.desc||''}
Careers: ${(sub.careers||[]).slice(0,20).join(', ')}
${(()=>{ const w = districtStrandWeights(clusterOf(sub.name)); return w ? `
The district's Program Maps already weight the academic courses for this cluster (1–10, higher = more important):
${Object.keys(w).map(k=>`- ${k}: ${w[k].courses.join(', ')}`).join('\n')}
Start the strand shares from these weightings: a subject the district weights more heavily gets more weeks. Say in the
rationale where you departed from them and why.` : ''; })()}

Return JSON only:
{
  "rationale": "3-4 sentences defending the balance: what this career demands more of, what it needs less of",
  "strands": [{ "subject": "", "weeks": 0, "emphasis": "", "why": "one sentence" }],
  "sequence": [{ "week": 1, "strand": "", "title": "3-6 words", "focus": "one line" }]
}

Rules:
- strands contains exactly these five, none zero: ${STRANDS.join(', ')}.
- The five must total exactly 30 weeks. Career & Technical is largest, between 12 and 16.
- The four academic shares must differ from one another and reflect the career. Never split evenly.
- sequence contains exactly 30 entries numbered 1 to 30, and the count per strand must match strands.
- Interleave the strands. Never block one subject together.
- Every academic week is contextualised to this sub-cluster, not generic.`
    });
    const j = extractJSON(raw);
    if(!j || !(j.strands||[]).length) throw new Error('The plan came back unreadable. Nothing was changed.');
    /* The week-by-week sequence is what teachers build from, so the strand
       totals are taken from it — otherwise a badge built exactly to plan
       could never pass its own strand check. */
    reconcileBadgePlan(j);
    const total = (j.strands||[]).reduce((n,s)=>n+(s.weeks||0),0);
    c.badgePlan = j; c.updatedAt = nowISO();
    toast(total===30 ? 'Thirty weeks planned' : `Planned, but the strands total ${total} — replan it`);
  }catch(e){ toast(esc(e.message||'Could not plan it')); }
  busyEnd();
}

/* =========================================================
   DRAFT → REVIEW → APPROVED → PUBLISHED
   ---------------------------------------------------------
   Teachers build and submit. Only an administrator approves,
   and only an approved credential can be published. Every
   transition is recorded with who and when, because "who let
   this reach students" is the first question anybody asks when
   something is wrong.
   ========================================================= */

const TRANSITIONS = {
  draft:     [{ to:'review',    label:'Submit for review', perm:'credential.submit', primary:true, own:true }],
  review:    [{ to:'approved',  label:'Approve',           perm:'credential.approve', primary:true },
              { to:'draft',     label:'Send back',         perm:'credential.approve' },
              { to:'draft',     label:'Withdraw',          perm:'credential.submit', own:true, ownerOnly:true }],
  approved:  [{ to:'published', label:'Publish',           perm:'credential.publish', primary:true },
              { to:'draft',     label:'Send back',         perm:'credential.approve' }],
  published: [{ to:'draft',     label:'Make changes',      perm:'credential.submit', own:true, keepLive:true },
              { to:'unpublished', label:'Unpublish',       perm:'credential.unpublish' }]
};
const RANK = { draft:0, review:1, approved:2, published:3 };

/* Who may change a credential. Teachers edit their own; administrators edit
   anything. Everyone can read everything and reuse any week. The back end
   enforces the same rule — this only decides what is shown. */
const canEdit  = c => !!(S.user && c && (can('credential.edit.any') ||
                   (can('credential.edit.own') && c.createdBy === S.user.name)));
/* Anything past draft is frozen: what a reviewer approved is exactly what
   is published. Changing it means starting a new draft. */
const isLocked = c => !!c && c.status !== 'draft';
const editable = c => canEdit(c) && !isLocked(c);

/* A credential cannot be submitted half-finished — that is the whole point
   of the gate, and it is checked here rather than left to a reviewer. */
function blockers(c){
  const out = [];
  if(c.level==='nano'){
    if(!c.content) out.push('The week has not been written yet.');
    else {
      const bad = weekChecks(c.content).filter(x=>!x.ok);
      if(bad.length) out.push(`${bad.length} check${bad.length===1?'':'s'} still failing: ${bad.map(b=>b.label).join('; ')}.`);
    }
    return out;
  }
  const lv = LEVEL(c.level), kids = childrenOf(c);
  if(kids.length < lv.count) out.push(`${lv.count-kids.length} of ${lv.count} ${ofLabel(c, lv.count-kids.length)} still missing.`);
  kids.filter(k=>k.level!=='nano').forEach(k=>{
    const b = blockers(k); if(b.length) out.push(`${k.title}: ${b[0]}`);
  });
  const weeks = weeksBeneath(c);
  const unwritten = weeks.filter(k=>!k.content).length;
  if(unwritten) out.push(`${unwritten} week${unwritten===1?'':'s'} inside ${unwritten===1?'has':'have'} not been written.`);
  const failing = weeks.filter(k=>k.content && weekChecks(k.content).some(x=>!x.ok));
  if(failing.length) out.push(`Failing checks in ${failing.map(k=>`“${k.title}”${canEdit(k)?'':` (owned by ${k.createdBy||'someone else'})`}`).join(', ')}.`);
  if(!c.cumulative) out.push('There is no cumulative assessment.');
  else if(cumulativeStale(c)) out.push('The cumulative assessment is out of date — the weeks changed after it was built.');
  if(c.level==='badge'){
    if(!c.badgePlan) out.push('The strand plan has not been made.');
    else {
      const have = {}; kids.forEach(k=>{ const s=k.strand||'Career & Technical'; have[s]=(have[s]||0)+1; });
      const off = (c.badgePlan.strands||[]).filter(s=>(have[s.subject]||0)!==(s.weeks||0));
      if(off.length) out.push(`Strands do not match the plan: ${off.map(s=>`${s.subject} ${have[s.subject]||0}/${s.weeks}`).join(', ')}.`);
    }
  }
  return out;
}
const ofLabel = (c, n) => { const of = LEVEL(c.level).of;
  return of==='nano' ? `week${n===1?' is':'s are'}` : `${LEVEL(of).short.toLowerCase()}-credential${n===1?' is':'s are'}`; };

/* Everything beneath a container, each once, containers included. */
/* Every published credential this one sits inside, however deep. */
function publishedAncestors(c, seen){
  seen = seen || new Set(); const out = [];
  usedBy(c.id).forEach(u=>{ if(seen.has(u.id)) return; seen.add(u.id); if(u.status==='published' || u.live) out.push(u); out.push(...publishedAncestors(u, seen)); });
  return out;
}
function descendants(c, seen){
  seen = seen || new Set(); const out=[];
  childrenOf(c).forEach(k=>{ if(seen.has(k.id)) return; seen.add(k.id); out.push(k); if(k.level!=='nano') out.push(...descendants(k, seen)); });
  return out;
}

function workflowPanel(c){
  const st = STATUS(c.status);
  const mine = S.user && c.createdBy === S.user.name;
  const moves = (TRANSITIONS[c.status]||[]).filter(m=>can(m.perm) && (!m.own || canEdit(c)) && (!m.ownerOnly || mine));
  const stop = blockers(c);
  const kidsDraft = c.level!=='nano' && c.status==='review' ? descendants(c).filter(k=>k.status==='draft') : [];
  const disabled = m => (m.to==='review' && stop.length) || (m.to==='approved' && (stop.length || kidsDraft.length));
  return `<div class="card pad-lg mt16">
    <div class="spread wrap" style="gap:10px">
      <h3>State</h3>
      <div class="row gap" style="gap:6px">
        ${c.live?`<span class="pill green">Live version published</span>`:''}
        <span class="pill ${st.tone}">${esc(st.label)}</span>
      </div>
    </div>
    <p class="small muted mt4">${esc(c.live && c.status!=='published' ? 'Students still see the published version until this one is approved and published.' : st.who)}</p>

    ${c.history&&c.history.length?`<div class="mt16" style="display:grid;gap:7px">
      ${c.history.slice(-5).map(h=>`<div class="row gap" style="gap:10px;align-items:center">
        <span class="pill xs">${esc(h.label || STATUS(h.to).label)}</span>
        <span class="xs muted">${esc(h.by)} · ${esc((h.at||'').slice(0,16).replace('T',' '))}${h.note?` · ${esc(h.note)}`:''}</span>
      </div>`).join('')}
    </div>`:''}

    ${(()=>{ const h=(c.history||[]).slice(-1)[0]; return c.status==='draft' && h && h.feedback ? `<div class="callout why mt16"><span class="ic">${ic('flag')}</span>
      <div><b>Sent back by ${esc(h.by)}:</b> ${esc(h.note)}</div></div>` : ''; })()}
    ${stop.length && (c.status==='draft' || c.status==='review')?`<div class="callout ex mt16"><span class="ic">${ic('flag')}</span>
      <div><b>${c.status==='draft'?'Not ready to submit.':'Cannot be approved yet.'}</b><ul style="margin:6px 0 0;padding-left:18px">
        ${stop.map(x=>`<li style="margin-bottom:3px">${esc(x)}</li>`).join('')}</ul></div></div>`:''}
    ${kidsDraft.length?`<div class="callout ex mt16"><span class="ic">${ic('flag')}</span>
      <div>${kidsDraft.length} item${kidsDraft.length===1?' inside is':'s inside are'} back in draft:
        ${kidsDraft.map(k=>esc(k.title)).join(', ')}. They must be resubmitted first.</div></div>`:''}
    ${c.level!=='nano' && c.status==='draft' && !stop.length?`<div class="xs muted mt12">Submitting sends everything inside it
      for review too, and approving or publishing it carries everything inside with it.</div>`:''}

    <div class="actbar">
      <span class="xs muted">${c.status==='published'
        ? 'Visible to students. Changes start a new draft; this version stays live until the next is published.'
        : c.status==='review' ? 'Waiting on an administrator. Locked while it is reviewed.'
        : c.status==='approved' ? 'Approved and locked. Publishing makes it visible to students.'
        : 'Nothing reaches students until an administrator approves it.'}</span>
      <div class="row gap">
        ${moves.map(m=>`<button class="btn ${m.primary?'primary':''}"
          ${disabled(m)?'disabled':''} data-move="${m.to}" data-movelabel="${esc(m.label)}">${esc(m.label)}</button>`).join('')
          || '<span class="xs muted2">No action available to you.</span>'}
      </div>
    </div>
  </div>`;
}

/* One snapshot of what students see. Taken when changes start on something
   already published, so they keep the approved version meanwhile. */
function liveSnapshot(c){
  return JSON.parse(JSON.stringify({ title:c.title, subtitle:c.subtitle, content:c.content||null, overview:c.overview||null,
    children:c.children||null, cumulative:c.cumulative||null, publishedAt:c.publishedAt }));
}

function moveTo(c, to, label, quiet, note){
  const by = (S.user&&S.user.name)||'';
  const from = c.status;
  const backLabel = label==='Send back' ? 'Sent back' : label==='Withdraw' ? 'Withdrawn' : null;
  c.history = c.history || [];
  if(to==='unpublished'){
    c.status='draft'; c.live=null; c.history.push({ to:'draft', label:'Unpublished', by, at:nowISO() });
  } else if(c.status==='published' && to==='draft'){
    c.live = liveSnapshot(c); c.status='draft';
    c.history.push({ to:'draft', label:'Changes started', by, at:nowISO(), note:'published version stays live' });
  } else {
    c.status = to;
    c.history.push({ to, label: backLabel || STATUS(to).label, by, at: nowISO(), ...(note?{ note, feedback:true }:{}) });
    if(to==='published'){ c.publishedAt = nowISO(); c.live = null; }
    if(to==='approved')  c.approvedBy  = by;
    if(to==='review')    c.submittedBy = by;
  }
  c.updatedAt = nowISO();
  /* A container carries what is inside it: submitting a micro submits its
     weeks, approving it approves them, publishing it publishes them. Never
     the other way, and never downwards — a shared week already further
     along is left where it is. */
  /* Sending back or withdrawing a container takes back what came in with it,
     so the author can change those weeks too. Weeks submitted on their own,
     or with another credential, are left alone. */
  if(c.level!=='nano' && backLabel && RANK[from]>0){
    descendants(c).forEach(k=>{
      const last = (k.history||[]).slice(-1)[0] || {};
      if(k.status===from && last.note===`with ${c.title}`){
        k.status='draft'; k.history.push({ to:'draft', label:backLabel, by, at:nowISO(), note:`with ${c.title}` }); k.updatedAt=nowISO();
      }
    });
  }
  if(c.level!=='nano' && RANK[to]!=null && RANK[to]>0){
    descendants(c).forEach(k=>{
      if(RANK[k.status] === RANK[to]-1){
        k.status = to; k.history = k.history||[];
        k.history.push({ to, label:STATUS(to).label, by, at:nowISO(), note:`with ${c.title}` });
        if(to==='published'){ k.publishedAt = nowISO(); k.live=null; }
        if(to==='approved') k.approvedBy = by;
      }
    });
  }
  const said = to==='unpublished' ? 'unpublished' : (c.status==='draft' && c.live) ? 'new draft started; the published version stays live' : STATUS(c.status).label.toLowerCase();
  if(!quiet){ toast(`${esc(c.title)} — ${esc(said)}`); render(); }
}
function bindWorkflow(c){
  $$('[data-move]').forEach(b=> b.onclick = ()=>{
    if(b.dataset.move==='unpublished'){
      const live = publishedAncestors(c);
      if(live.length) return modal(`<div><h2>Unpublish ${esc(c.title||'')}?</h2>
        <p class="small mt8">It is part of ${live.length===1?'a published credential':'published credentials'} students are taking:</p>
        <ul class="small mt8">${live.map(x=>`<li><b>${esc(x.title)}</b> · ${esc(LEVEL(x.level).short)}</li>`).join('')}</ul>
        <p class="small muted mt8">Unpublishing it would leave ${live.length===1?'that credential':'them'} with a missing week. Unpublish ${live.length===1?'that credential':'those'} first, or use Make changes — students keep this version until the new one is published.</p>
        <div class="actbar"><button class="btn" data-close>Close</button></div></div>`);
      return moveTo(c, 'unpublished', b.dataset.movelabel);
    }
    if(b.dataset.movelabel!=='Send back') return moveTo(c, b.dataset.move, b.dataset.movelabel);
    modal(`<div><h2>Send back ${esc(c.title||'')}</h2>
      <p class="small muted mt8">It returns to draft so ${esc(c.createdBy||'the author')} can change it${c.level!=='nano'?', with everything that came in with it':''}.</p>

/* Taxonomy corrections are stored as edits on top of the loaded maps, so a
   reload of the maps does not silently discard them. */
function applyTaxEdit(oldName, e){
  const both = [ ...CLUSTER_MAP.flatMap(c=>c.subs), ...SUBCLUSTERS ].filter(x=>x.name===oldName);
  both.forEach(x=>{ x.name=e.name; x.desc=e.desc; x.careers.splice(0, x.careers.length, ...e.careers); });
  if(oldName!==e.name) S.creds.forEach(c=>{ if(c.subCluster===oldName) c.subCluster=e.name; });
}

  if(S.user) add(S.user.name, S.user.email, S.user.role);

}

function bindAdmin(){
  $$('[data-atab]').forEach(b=> b.onclick = ()=>{ S.adminTab=b.dataset.atab; render(); });
  if(S.adminTab==='placements') bindPlacements();

  /* taxonomy */
  $$('[data-asub]').forEach(b=> b.onclick = ()=>{ S.taxOpen = b.dataset.asub; render(); const t=$('#txname'); if(t){ t.scrollIntoView({block:'center'}); t.focus(); } });
  const tc=$('[data-taxclose]'); if(tc) tc.onclick = ()=>{ S.taxOpen=null; render(); };
  const tsv=$('[data-taxsave]');
  if(tsv) tsv.onclick = ()=>{
    const old = S.taxOpen, name = $('#txname').value.trim();
    if(!name){ toast('A sub-cluster needs a name'); return; }
    if(name!==old && subCluster(name)){ toast('Another sub-cluster already has that name'); return; }
    const e = { name, desc: $('#txdesc').value.trim(), careers: $('#txcar').value.split('\n').map(x=>x.trim()).filter(Boolean) };
    applyTaxEdit(old, e);
    S.taxEdits = (S.taxEdits||[]).concat([{ from: old, ...e }]);
    S.taxOpen = name; toast('Sub-cluster saved'); render();
  };

  /* standards — written through as they are typed */
  $$('[data-astd]').forEach(t=> t.oninput = ()=>{ ALL_STANDARDS[+t.dataset.astd].desc = t.value; persist(); });
  const ss=$('[data-astdsave]'); if(ss) ss.onclick = ()=>{ toast('Standards saved'); render(); };
  $$('[data-astdok]').forEach(b=> b.onclick = ()=>{ const x=ALL_STANDARDS[+b.dataset.astdok]; x.status='verified'; x.verifiedBy=(S.user||{}).name||''; persist(); toast(`${esc(x.code)} verified — weeks can now cite it`); render(); });
  $$('[data-astddel]').forEach(b=> b.onclick = ()=>{ ALL_STANDARDS.splice(+b.dataset.astddel,1); persist(); render(); });
  const fw = ()=> ($('#astdfw')||{}).value ? $('#astdfw').value.trim() : '';
  const loadStd = async (text, from, drafted) => {
    if(!aiLive()){ toast('The content service is not available'); return; }
    toast(drafted ? `Drafting ${esc(from)}…` : `Reading ${esc(from)}…`);
    try{
      const out = extractJSON(await callModel({ system:'You extract learning standards. Return JSON only.', maxTokens:6000, user: drafted
? `List the standards of "${from}" that a grade 9–12 career and technical course would cite, each with its official code and its wording.
If you are not sure of an exact code, leave it out. Return JSON only: { "standards": [ { "code": "", "desc": "" } ] }`
: `From the document below, list every learning standard, competency or Portrait of a Graduate attribute it defines, with its code
exactly as the document writes it (or a short label if it has none) and its wording. Do not add anything the document does not contain.
<document>\n${String(text).slice(0,30000)}\n</document>
Return JSON only: { "standards": [ { "code": "", "desc": "" } ] }` }));
      const list = ((out||{}).standards||[]).filter(x=>x && x.code && x.desc);
      let n = 0;
      list.forEach(x=>{ const code = String(x.code).trim(); if(standardByCode(code) && standardByCode(code).code.toLowerCase()===code.toLowerCase()) return;
        ALL_STANDARDS.push({ code, desc:String(x.desc).trim(), from, status: drafted ? 'drafted' : 'verified', framework: fw()||from }); n++; });
      persist(); toast(n ? `${n} standard${n===1?'':'s'} added${drafted?' as drafted':''}` : 'No new standards found'); render();
    }catch(e){ toast(esc(e.message||'Could not read the standards')); }
  };
  const df=$('[data-astddraft]'); if(df) df.onclick = ()=>{ if(!fw()){ toast('Name the framework first'); return; } loadStd('', fw(), true); };
  const sf=$('#astdf'), sfb=$('[data-astdfile]');
  if(sfb) sfb.onclick = ()=>{ const t=($('#astdpaste')||{}).value||''; if(t.trim().split(/\s+/).length>=20) loadStd(t, fw()||'Pasted standards', false); else sf.click(); };
  if(sf) sf.onchange = ()=>{ const f=sf.files[0]; if(f) readSourceFile(f).then(src=>loadStd(src.text, fw()||f.name.replace(/\.[^.]+$/,''), false)).catch(e=>toast(esc(e.message||'Could not read that file'))); };
  const sa=$('[data-astdadd]');
  if(sa) sa.onclick = ()=>{
    const code=$('#anewcode').value.trim(), desc=$('#anewdesc').value.trim();
    if(!code||!desc){ toast('A standard needs a code and its wording'); return; }
    if(standardByCode(code)){ toast('That code is already loaded'); return; }
    ALL_STANDARDS.push({ code, desc }); toast(`${esc(code)} added`); render();
  };

  /* menus — written through as they are typed */
  $$('[data-amenu]').forEach(f=> f.oninput = ()=>{
    const [kind,i,key] = f.dataset.amenu.split('.');
    if(MENUS[kind] && MENUS[kind][+i]) MENUS[kind][+i][key] = f.value;
    persist();
  });
  $$('[data-amenudrop]').forEach(b=> b.onclick = ()=>{
    const [kind,i] = b.dataset.amenudrop.split('.');
    if(MENUS[kind].length<=1){ toast('Keep at least one option'); return; }
    MENUS[kind] = MENUS[kind].filter((_,x)=>x!==+i);
    toast('Retired. Credentials that used it are unchanged.'); render();
  });
  $$('[data-amenuadd]').forEach(b=> b.onclick = ()=>{
    const kind = b.dataset.amenuadd;
    MENUS[kind] = MENUS[kind].concat([{ id: uid('opt'), name:'New option', blurb:'',
      tool: kind==='deliverable' ? 'Docs' : undefined }]);
    render();
  });

  /* people */
  $$('[data-prole]').forEach(sel=> sel.onchange = ()=>{ const p=peopleList()[+sel.dataset.prole]; if(p){ p.role=sel.value; toast(`${esc(p.name)} is now ${sel.value==='admin'?'an administrator':'a teacher'}`); render(); } });
  const pi=$('[data-pinvite]');
  if(pi) pi.onclick = ()=>{
    const email=$('#pmail').value.trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('That does not look like an email address'); return; }
    if(peopleList().some(p=>p.email===email)){ toast('Already on the list'); return; }
    S.people.push({ name: nameFromEmail(email)||email, email, role: $('#prole').value });
    toast(`Invited ${esc(email)}`); render();
  };

  /* service */
  const svc=$('#asvc'); if(svc) svc.oninput = ()=>{ S.proxyURL = svc.value.trim(); };
  const q=$('#asvcq');  if(q) q.onchange = ()=>{ S.quality = q.value; };
  const t=$('[data-asvctest]');
  if(t) t.onclick = async ()=>{
    t.disabled = true; t.textContent = 'Testing…';
    const ok = await probeProxy();
    if(ok) saveService(S.proxyURL);
    t.disabled = false; t.textContent = 'Test';
    toast(ok ? 'Service reachable' : 'No answer from that address');
    render();
  };
  const cl=$('[data-aclear]');
  if(cl) cl.onclick = ()=> modal(`<div><h2>Clear everything saved in this browser?</h2>
      <p class="small muted mt8">Every credential, menu change, standard and person stored here is removed. This cannot be undone.</p>
      <div class="actbar"><button class="btn" data-close>Keep it</button><button class="btn primary" data-clok>Clear it</button></div></div>`,
    { after:(m,close)=>{ $('[data-clok]',m).onclick = ()=>{ try{ localStorage.removeItem(STORE_KEY); }catch(_){}
      SKIP_PERSIST = true; location.reload(); }; } });
}

/* =========================================================
   PLACEMENTS — the district's three models (inclusive, internal, external),
   each a seat count at a named employer with a named supervisor, and one gate
   this product controls: the employer's onboarding week, built from their own
   material, must be published before the placement opens. Students and their
   enrolment come with the student phase.
   ========================================================= */
const PLACEMENT_MODELS = [
  { id:'inclusive', name:'Inclusive', sub:'A cohort, placed together', blurb:'Students work alongside a community partner as a structured team; the onboarding week is shared across the cohort.' },
  { id:'internal',  name:'Internal',  sub:'Inside the school system',  blurb:'Departments the district already runs: IT support, athletics, communications. Onboarding is narrow and job-specific.' },
  { id:'external',  name:'External',  sub:'With a local employer',     blurb:'Off-site with a business in the district. The highest bar for preparation; onboarding is built from the employer\'s own material.' }
];
function placementGate(pl){
  const w = pl.onboardingId && CRED(pl.onboardingId);
  if(!w) return { ok:false, label:'No onboarding week yet' };
  if(w.status==='published' || w.live) return { ok:true, label:'Onboarding published — placement can open' };
  return { ok:false, label:`Onboarding week is ${STATUS(w.status).label.toLowerCase()}` };
}
function adminPlacements(){
  const list = S.placements||[];
  const nanos = S.creds.filter(c=>c.level==='nano');
  return `<div class="card pad-lg">
    <div class="spread wrap" style="gap:10px"><h3>Placements</h3><span class="pill">${list.length}</span></div>
    <p class="small muted mt4" style="max-width:72ch">Senior-year placements, each opened by an onboarding week built from that employer's own material.
      A placement opens when its onboarding week is published.</p>
    <div class="grid3 mt16" style="gap:10px">${PLACEMENT_MODELS.map(m=>`<div class="card pad" style="background:var(--surface-2);box-shadow:none">
      <b class="small">${m.name}</b><div class="xs muted mt4">${esc(m.sub)}</div><div class="xs mt8">${esc(m.blurb)}</div></div>`).join('')}</div>
    <div class="mt20" style="display:grid;gap:10px">
      ${list.length ? list.map((pl,i)=>{ const g = placementGate(pl), w = pl.onboardingId && CRED(pl.onboardingId);
        return `<div class="card pad" style="background:var(--surface-2);box-shadow:none">
          <div class="spread wrap" style="gap:10px;align-items:flex-start">
            <div style="min-width:0"><b>${esc(pl.role||'Placement')}</b> · ${esc(pl.employer||'')}
              <div class="xs muted mt4">${esc((PLACEMENT_MODELS.find(m=>m.id===pl.model)||{}).name||'')} · ${esc(pl.subCluster||'')} · ${pl.seats||0} seat${pl.seats==1?'':'s'}${pl.supervisor?` · supervised by ${esc(pl.supervisor)}`:''}</div></div>
            <span class="pill ${g.ok?'green':''}">${esc(g.label)}</span>
          </div>
          <div class="row gap wrap mt12" style="gap:8px;align-items:center">
            ${w ? `<button class="btn sm" data-plopen="${w.id}">Open “${esc(w.title)}”</button>`
                : `<button class="btn sm primary" data-plwrite="${i}">${ic('spark')} Write the onboarding week</button>
                   <select class="field" data-pllink="${i}" style="max-width:260px"><option value="">…or link an existing week</option>${nanos.map(n=>`<option value="${n.id}">${esc(n.title)}</option>`).join('')}</select>`}
            <span class="grow"></span><button class="btn sm" data-pldel="${i}">Remove</button>
          </div></div>`; }).join('')
      : `<div class="small muted">No placements yet.</div>`}
    </div>
    <div class="card pad mt16" style="background:var(--surface-2);box-shadow:none">
      <b class="small">Add a placement</b>
      <div class="grid2 mt12" style="gap:12px">
        <div><label class="lbl" for="plsub">Sub-cluster</label><select class="field" id="plsub"><option value="">Choose one</option>${SUBCLUSTERS.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></div>
        <div><label class="lbl" for="plmodel">Model</label><select class="field" id="plmodel">${PLACEMENT_MODELS.map(m=>`<option value="${m.id}">${m.name} — ${esc(m.sub)}</option>`).join('')}</select></div>
        <div><label class="lbl" for="plemp">Employer or department</label><input class="field" id="plemp" list="plpartners" placeholder="Pick a district partner or type one"><datalist id="plpartners"></datalist></div>
        <div><label class="lbl" for="plrole">What the placement is called</label><input class="field" id="plrole" placeholder="e.g. Quality inspection assistant"></div>
        <div><label class="lbl" for="plseats">Seats</label><input class="field" id="plseats" type="number" min="1" value="2"></div>
        <div><label class="lbl" for="plsup">Supervisor</label><input class="field" id="plsup" placeholder="Name and role"></div>
      </div>
      <div class="actbar"><span class="xs muted">Partners listed are the district's own, from the Program Maps.</span><button class="btn primary" data-pladd>Add placement</button></div>
    </div>
  </div>`;
}
function bindPlacements(){
  const sub=$('#plsub'), dl=$('#plpartners');
  const fill = ()=>{ if(!dl) return; const pm = sub && sub.value && programMap(clusterOf(sub.value)); dl.innerHTML = pm ? pm.partners.map(x=>`<option value="${esc(x)}">`).join('') : ''; };
  if(sub){ sub.onchange = fill; fill(); }
  const add=$('[data-pladd]');
  if(add) add.onclick = ()=>{
    const pl = { id: uid('place'), subCluster: sub.value, model: $('#plmodel').value, employer: $('#plemp').value.trim(), role: $('#plrole').value.trim(),
      seats: Math.max(1, +$('#plseats').value||1), supervisor: $('#plsup').value.trim(), createdAt: nowISO() };
    if(!pl.subCluster || !pl.employer || !pl.role){ toast('A placement needs a sub-cluster, an employer and a name'); return; }
    S.placements = (S.placements||[]).concat([pl]); toast('Placement added'); render();
  };
  $$('[data-pldel]').forEach(b=> b.onclick = ()=>{ S.placements.splice(+b.dataset.pldel,1); render(); });
  $$('[data-pllink]').forEach(sel=> sel.onchange = ()=>{ if(!sel.value) return; S.placements[+sel.dataset.pllink].onboardingId = sel.value; render(); });
  $$('[data-plopen]').forEach(b=> b.onclick = ()=> openCred(b.dataset.plopen));
  /* Writing the onboarding week starts the normal create flow on the employer
     brief, already filled in from the placement. */
  $$('[data-plwrite]').forEach(b=> b.onclick = ()=>{
    const pl = S.placements[+b.dataset.plwrite];
    S.create = null; startCreate(); Object.assign(S.create, { step:2, level:'nano', subCluster: pl.subCluster, srcTab:'brief',
      brief:{ topic:`Onboarding: ${pl.role} at ${pl.employer}`, partner:true, org:pl.employer, role:pl.role }, placementId: pl.id });
    S.view='create'; render();
  });
}

/* =========================================================
   BOOT
   ---------------------------------------------------------
   In the product every read and write is an API call and the
   state object in core.js is exactly what the API returns. This
   reference build keeps the same data in the browser so that a
   reload does not lose a generated week.
   ========================================================= */
const STORE_KEY = 'foredu.authoring.v1';
let SKIP_PERSIST = false, PERSIST_T = null;
function persist(){
  if(SKIP_PERSIST) return;
  clearTimeout(PERSIST_T);
  PERSIST_T = setTimeout(()=>{
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify({
        v:1, creds:S.creds, people:S.people||[], user:S.user, quality:S.quality,
        menus:MENUS, standards:ALL_STANDARDS, taxEdits:S.taxEdits||[], placements:S.placements||[]
      }));
    }catch(e){ console.warn('could not save', e); }
  }, 250);
}
function restore(){
  try{
    const raw = localStorage.getItem(STORE_KEY); if(!raw) return;
    const d = JSON.parse(raw); if(!d || d.v!==1) return;
    S.creds = d.creds || [];
    // Weeks written before answer positions were spread get them spread once. Only option positions move — never text or which answer is right.
    S.creds.forEach(c=>{
      if(c.content && !c.content.keysSpread && c.content.contentQuiz){ spreadKeys(c.content.vocabQuiz); spreadKeys(c.content.contentQuiz); c.content.keysSpread = true; }
      if(c.badgePlan) reconcileBadgePlan(c.badgePlan);
      if(c.content && c.content.summarizing && c.content.summarizing.activity) tidyActivity(c.content.summarizing.activity);
      if(c.cumulative && !c.cumulative.keysSpread){ spreadKeys(c.cumulative.questions); c.cumulative.keysSpread = true; }
      // Weeks written when every week carried a generated video keep it switched on.
      if(c.content && c.content.videoOn==null){ c.content.videoOn = !!(c.content.video && (c.content.video.scenes||[]).length); if(c.videoGen==null) c.videoGen = c.content.videoOn; }
    });
    S.people = d.people || []; S.user = d.user || null; S.quality = d.quality || S.quality;
    if(d.menus) Object.keys(d.menus).forEach(k=>{ if(Array.isArray(d.menus[k]) && d.menus[k].length) MENUS[k] = d.menus[k]; });
    (MENUS.summarizing||[]).forEach(o=>{ o.blurb = String(o.blurb||'').replace('The Day 1 pre-response','The opening pre-response').replace('the Day 1 scenario','the opening scenario'); });
    if(Array.isArray(d.standards) && d.standards.length) ALL_STANDARDS.splice(0, ALL_STANDARDS.length, ...d.standards);
    (d.taxEdits||[]).forEach(e=>{ if(subCluster(e.from)) applyTaxEdit(e.from, e); });
    S.taxEdits = d.taxEdits || [];
    S.placements = d.placements || [];
  }catch(e){ console.warn('could not restore', e); }
}

function afterRender(){
  if(!S.user){ bindSignIn(); return; }
  if(S.view==='create'){ bindCreate(); return; }
  if(S.view==='admin'){ bindAdmin(); return; }
  if(S.view==='review'){ bindReview(); return; }
  if(S.view==='credential'){
    const c = CRED(S.openId);
    if(c && c.level==='nano'){ bindNano(); bindWorkflow(c); }
    else if(c){ bindContainer(); }
    return;
  }
  bindLibrary();
}

function bindLibrary(){
  $$('[data-open]').forEach(b=> b.onclick = ()=> openCred(b.dataset.open));
  const q=$('#libq');      if(q) q.oninput  = ()=>{ S.libFilter.q = q.value; renderLibraryOnly(); };
  const l=$('#liblevel');  if(l) l.onchange = ()=>{ S.libFilter.level = l.value; render(); };
  const s=$('#libsub');    if(s) s.onchange = ()=>{ S.libFilter.sub = s.value; render(); };
  const st=$('#libstatus');if(st) st.onchange= ()=>{ S.libFilter.status = st.value; render(); };
}
/* Typing in the search box must not steal focus by re-rendering the chrome. */
let libT;
function renderLibraryOnly(){
  clearTimeout(libT);
  libT = setTimeout(()=>{
    const q = $('#libq'), at = q && q.selectionStart;
    render();
    const q2 = $('#libq');
    if(q2){ q2.focus(); try{ q2.setSelectionRange(at,at); }catch(_){} }
  }, 180);
}

function boot(){
  restore();
  /* An address given in the link wins and is remembered; otherwise use the
     one this browser remembered last time. */
  try{ if(readProxyHash()) saveService(S.proxyURL); }catch(_){}
  if(!S.proxyURL) S.proxyURL = savedService();
  render();
  /* The probe decides whether "Write this week" is available, so every
     screen has to redraw when it answers, not just Settings. */
  probeProxy().then(()=> render());
}
document.addEventListener('DOMContentLoaded', boot);
if(document.readyState!=='loading') boot();

</script>
</body></html>
