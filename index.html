async function repairReflectionStrategy(j, system, cred){
  const sum = pickOf('summarizing', (cred.strategies||{}).summarizing);
  const sm = j.summarizing = j.summarizing || {};

  for(let tries=0; tries<2 && !reflectionShaped(sm); tries++){

`The week's opening scenario: ${String((j.activating||{}).scenario||'').slice(0,700)}
Essential Question: ${j.essentialQuestion||''}
The reflection step "Apply What You Learned" currently reads:
"${st.prompt||''}"

Rewrite it as a ${sum.name}: ${sum.blurb}

/* 3.9 — a vocabulary term that never appears in the reading gets one
   sentence added where it belongs; nothing else in the reading changes. */
async function repairVocabInReading(j, system){
  const secsOf = () => (j.reading.sections||[]);
  for(let tries=0; tries<2; tries++){
    const missing = vocabNotInReading(j); if(!missing.length) return;
    busyStage(`Working ${missing.length} vocabulary term${missing.length>1?'s':''} into the reading`);
    const secs = secsOf().map((s,i)=>`SECTION ${i}: ${s.heading}\n${s.body}`).join('\n\n').slice(0,9000);
    const out = extractJSON(await callModel({ system, maxTokens:2500, user:
`These vocabulary terms are in the week's list but never appear in the reading:
${missing.map(t=>'- '+t+' — '+(((j.vocabulary||[]).find(v=>v.term===t)||{}).def||'')).join('\n')}

${secs}

For each term, write ONE sentence that uses the term exactly as written and fits naturally at the end of the most relevant section
(sections are numbered from 0 to ${Math.max(0,secsOf().length-1)}).
Return JSON only: { "add": [ { "section": 0, "term": "", "sentence": "" } ] }` }));
    /* Matched on the sentence, not on what the model says it did: each missing
       term goes in once, into the section named, or the last one if that is out of range. */
    const adds = (out||{}).add || [];
    missing.forEach(t=>{
      const a = adds.find(x=>x && x.sentence && termRe(t).test(String(x.sentence))); if(!a) return;
      const n = Number.isInteger(+a.section) && secsOf()[+a.section] ? +a.section : secsOf().length-1;
      const sec = secsOf()[n]; if(sec) sec.body = String(sec.body||'').trim()+' '+String(a.sentence).trim();
    });
  }
}

/* 3.13 — options rewritten where the right answer stands out by length, or a
   wrong option is recycled. Each flagged question gets its own length target;
   each rewrite is kept question by question, only where it fixes that
   question, and the right answer stays at its index (for vocabulary, the
   same term). Two passes at most. */
function optionStandsOut(q){
  const L=(q.o||[]).map(o=>String(o||'').length), a=L[q.a]||0, m2=Math.max(0,...L.filter((_,k)=>k!==q.a));
  return a>m2 && a>=m2*1.2;
}
function reusedAt(list){
  const norm = o => String(o||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  const seen = {}; (list||[]).forEach((q,i)=>(q.o||[]).forEach((o,k)=>{ if(k!==q.a){ const n=norm(o); (seen[n]=seen[n]||[]).push(i); } }));
  return Object.values(seen).filter(v=>v.length>1).flatMap(v=>v.slice(1));
}
/* Vocabulary options must be the week's own terms, so the right term can only
   be evened out by choosing other terms of similar length. Done without the
   model: the shortest wrong option is swapped for a longer unused term while
   the right one still stands out. The right answer never moves. */
function evenVocabOptions(d){
  const terms = (d.vocabulary||[]).map(v=>v.term);
  (d.vocabQuiz||[]).forEach(q=>{
    if(!Array.isArray(q.o) || q.o.length!==4) return;
    for(let guard=0; guard<3 && optionStandsOut(q); guard++){
      const right = q.o[q.a], used = new Set(q.o);
      const spare = terms.filter(t=>!used.has(t) && t!==right).sort((a,b)=>b.length-a.length)[0];
      const w = q.o.map((_,k)=>k).filter(k=>k!==q.a).sort((a,b)=>String(q.o[a]).length-String(q.o[b]).length)[0];
      if(!spare || spare.length <= String(q.o[w]).length) break;
      q.o[w] = spare;
    }
  });
}
/* A vocabulary answer that stands out only counts against the week when a
   longer unused term was available; with these terms it might be unavoidable. */
function vocabStandsOut(d){
  const terms = (d.vocabulary||[]).map(v=>v.term); let avoidable = 0, unavoidable = 0;
  (d.vocabQuiz||[]).forEach(q=>{ if(!optionStandsOut(q)) return;
    const used = new Set(q.o||[]), minWrong = Math.min(...(q.o||[]).filter((_,k)=>k!==q.a).map(o=>String(o).length));
    if(terms.some(t=>!used.has(t) && t.length>minWrong)) avoidable++; else unavoidable++; });
  return { avoidable, unavoidable };
}
async function repairDistractors(j, system){
  evenVocabOptions(j);
  for(const key of ['contentQuiz']){
    for(let tries=0; tries<2; tries++){
      const list = j[key]||[]; const reuse = key==='contentQuiz' ? reusedOptions(list) : 0;
      if(longestCorrect(list) <= LONGEST_LIMIT && !reuse) break;
      busyStage(key==='contentQuiz'?'Evening out the content question options':'Evening out the vocabulary question options');
      const rIdx = key==='contentQuiz' ? reusedAt(list) : [];
      const targets = list.map((q,i)=>i).filter(i=>optionStandsOut(list[i]) || rIdx.includes(i));
      if(!targets.length) break;
      const terms = (j.vocabulary||[]).map(v=>v.term);
      const out = extractJSON(await callModel({ system, maxTokens:4000, user:
`Multiple-choice options give the answer away: the right answer is much longer or more detailed than the wrong ones${reuse?', or a wrong option is reused from another question':''}.
Fix only these questions:
${targets.map(i=>{ const q=list[i], n=String(q.o[q.a]||'').length; return `- i=${i}: "${q.stem}"\n  right answer (index ${q.a}, ${n} characters): "${q.o[q.a]}"\n  current options: ${JSON.stringify(q.o)}${rIdx.includes(i)?'\n  (one wrong option repeats another question\'s option; replace it)':''}`; }).join('\n')}

${key==='vocabQuiz'
 ? `Options must stay terms from this list, written exactly: ${terms.join(', ')}. Keep the right answer exactly as it is, at its index. Choose wrong terms close to it in length and easy to confuse with it.`
 : `For each question, return four options of similar length (each within about 15% of the others) and the same style. Either make each wrong option as specific as the right answer, with a believable detail a student who half-learned the reading would choose, or tighten the right answer to the length of the others without changing what it means. Keep the right answer at index ${'"'}a${'"'} and keep it correct. Wrong options must be plainly wrong to someone who learned the reading — never partly right, never a weaker version of the right answer — and not reused from any other question.`}
Return JSON only: { "questions": [ { "i": 0, "o": ["","","",""] } ] }` }));
      const next = JSON.parse(JSON.stringify(list)); let changed = 0;
      ((out||{}).questions||[]).forEach(r=>{
        const q = next[+r.i]; if(!q || !targets.includes(+r.i) || !Array.isArray(r.o) || r.o.length!==4 || !r.o.every(x=>String(x||'').trim())) return;
        const cand = Object.assign({}, q, { o: r.o.map(x=>String(x).trim()) });
        if(key==='vocabQuiz' && (cand.o[q.a]!==q.o[q.a] || !cand.o.every(o=>terms.includes(o)))) return;
        if(!optionStandsOut(cand) || (optionStandsOut(q) && !optionStandsOut(cand))){ next[+r.i] = cand; changed++; }
      });
      const score = l => longestCorrect(l) + (key==='contentQuiz'?reusedOptions(l):0);
      // No better this time: keep what we had and try once more (answers vary run to run).
      if(!changed || score(next) >= score(list)) continue;
      j[key] = next;
    }
  }
}

/* 3.17, 3.21 — the deliverable must say what to use and what to submit, and
   carry the district rubric. Missing parts are written by one narrow call. */
async function repairDeliverable(j, system){
  const e = j.extending = j.extending || {};
  const needR = !rubricIsDistrict(e.rubric), needM = !(e.materials||[]).length, needS = String(e.submit||'').trim().length<=10;
  if(!needR && !needM && !needS) return;
  busyStage(needR ? 'Writing the district rubric' : 'Adding what to use and what to submit');
  const out = extractJSON(await callModel({ system, maxTokens:3000, user:
`The week's deliverable:
Task: ${e.task||''}
Directions: ${(e.steps||[]).join(' / ')}
Success criteria: ${(e.success||[]).join(' / ')}

Write ${[needM&&'"materials" (what the student needs, only what is really needed)', needS&&'"submit" (exactly what to hand in and in what format)', needR&&`"rubric" with exactly the criteria ${RUBRIC_CRITERIA.join(', ')}, each describing all four levels (${RUBRIC_LEVELS.join(', ')}) specifically for this task`].filter(Boolean).join(', ')}.
Return JSON only: { "materials": [""], "submit": "", "rubric": [ { "criterion": "", "levels": ["","","",""] } ] }` }));
  if(!out) return;
  if(needM && Array.isArray(out.materials) && out.materials.length) e.materials = out.materials.map(String);
  if(needS && out.submit) e.submit = String(out.submit);
  if(needR && rubricIsDistrict(out.rubric)) e.rubric = out.rubric.map((r,i)=>({ criterion: RUBRIC_CRITERIA[i]||r.criterion, levels: r.levels.map(String) }));
}

/* Labels that only steer rendering are mapped to the nearest known kind
   rather than failing the week: a scene called "steps" is a sequence. */
const SCENE_ALIAS = { steps:'sequence', process:'sequence', procedure:'sequence', timeline:'sequence',
  table:'comparison', contrast:'comparison', 'compare':'comparison', cause:'cause-and-effect', effect:'cause-and-effect',
  diagram:'annotated-diagram', labeled:'annotated-diagram', mistake:'counter-example', 'non-example':'counter-example' };
/* Models often write an activity's questions into its instructions as well
   as listing them. When the items are listed, the instructions keep only the
   lead-in before the numbered part. */
function tidyActivity(a){
  if(!a || !(a.items||[]).length || !a.instructions) return a;
  const t = String(a.instructions), m = t.search(/(^|\s)(1[).:](?!\d)|\(1\))/);
  if(m >= 0){ const lead = t.slice(0, m).trim().replace(/[:\s]+$/,''); a.instructions = (lead ? lead.replace(/[^.!?]$/, x=>x+':') : 'Answer each question below:'); }
  return a;
}
function normalizeWeek(j){
  if(j.summarizing && j.summarizing.activity) tidyActivity(j.summarizing.activity);
  ((j.video||{}).scenes||[]).forEach(s=>{
    const k = String(s.kind||'').toLowerCase().trim();
    s.kind = SCENE_KINDS.includes(k) ? k : (SCENE_ALIAS[k] || Object.keys(SCENE_ALIAS).filter(a=>k.includes(a)).map(a=>SCENE_ALIAS[a])[0] || 'sequence');
  });
  const vk = VISUAL_KINDS.map(v=>v.id);
  ((j.reading||{}).sections||[]).forEach(sec=> (sec.visuals||[]).forEach(v=>{
    const k = String(v.kind||'').toLowerCase().replace(/[^a-z]/g,'');
    v.kind = vk.includes(k) ? k : (/safe|hazard/.test(k)?'safety':/career/.test(k)?'career':/best|practice/.test(k)?'practice':/quick|knowledge|selfcheck/.test(k)?'quickcheck':/flow|chain|organi/.test(k)?'flow'
      :/key|point|tip/.test(k)?'keypoint':/work|scen|case/.test(k)?'workplace':/mistake|error|wrong/.test(k)?'mistake'
      :/table|compar/.test(k)?'table':/step|proced|process/.test(k)?'steps':/check|list/.test(k)?'checklist':/decis|if/.test(k)?'decision':'keypoint');
  }));
  const L = Object.keys(COGNITIVE_MIX);
  (j.contentQuiz||[]).forEach(q=>{ const m = L.find(l=>l.toLowerCase()===String(q.level||'').toLowerCase().trim()); if(m) q.level = m; });
  [...(j.vocabQuiz||[]), ...(j.contentQuiz||[])].forEach(q=>{ q.a = +q.a||0; });
}

/* Models put the right answer first far too often (20 of 20 in one live
   week). Students get a shuffled paper anyway, but the stored key is what a
   reviewer reads, what gets printed or exported, and what the product keeps
   if shuffling is ever switched off. The right option is
   moved to a balanced, shuffled position — A to D used two or three times
   each in ten. Option text moves with it, so the key stays correct. Options
   that refer to each other ("all of the above", "both A and B") stay put. */
/* An option that points at other options ("All of the above", "Both A and B",
   "None of these") only makes sense where it was written, so it pins its
   question's order. Plain words like "both" or "above 140" do not. */
function isCrossRef(o){ return /\b(all|none|both|neither|each) of (the )?(above|below|these|those|them|the options)\b|\b(both|neither|either|only) [A-D]\b|\b[A-D],? (and|or|nor|&) [A-D]\b|^\s*(all|none) (of )?(the )?(above|below)\s*\.?\s*$/i.test(String(o||'')); }
function keyHash(s){ let h=2166136261; for(const ch of String(s)){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function spreadKeys(list){
  if(!Array.isArray(list) || !list.length) return list;
  const slots = list.map((_,i)=>i%4);
  let seed = keyHash(list.map(q=>q&&q.stem).join('|')) || 1;
  for(let i=slots.length-1;i>0;i--){ seed = (Math.imul(seed,1103515245)+12345)>>>0; const r = seed%(i+1); [slots[i],slots[r]]=[slots[r],slots[i]]; }
  list.forEach((q,i)=>{
    if(!q || !Array.isArray(q.o) || q.o.length!==4) return;
    if(q.o.some(isCrossRef)) return;
    const a = +q.a||0, t = slots[i]; if(a===t) return;
    [q.o[a], q.o[t]] = [q.o[t], q.o[a]]; q.a = t;
  });
  return list;
}

/* The quiz rules are checked, not trusted. When the model misses the
   3/3/2/2 spread or tests words that are not on the list, a narrow second
   call rewrites only that quiz; the rewrite is kept only if it is better. */
function mixOff(list){ const m={}; (list||[]).forEach(q=>{ m[q.level]=(m[q.level]||0)+1; });
  const unsituated = Math.max(0, 3 - (list||[]).filter(q=>(q.level==='Application'||q.level==='Analysis') && isSituated(q)).length);
  return Object.keys(COGNITIVE_MIX).reduce((n,k)=>n+Math.abs((m[k]||0)-COGNITIVE_MIX[k]),0) + Math.abs((list||[]).length-10) + unsituated; }
function vocabMiss(d, list){ const c = vocabAnswerCoverage(Object.assign({}, d, { vocabQuiz:list })); return (c.total - c.once) + Math.abs((list||[]).length-10); }
async function repairQuizzes(j, system){
  const fixOne = async (key, ask, score) => {
    for(let tries=0; tries<2 && score(j[key])>0; tries++){
      busyStage(ask.stage);
      const raw = await callModel({ system, maxTokens:6000, user: ask.user });
      const out = extractJSON(raw); const list = out && (out[key] || (Array.isArray(out)?out:null));
      if(Array.isArray(list) && list.length===10 && list.every(q=>q && q.stem && (q.o||[]).length===4 && q.a>=0 && q.a<4)
         && score(list) < score(j[key])) j[key] = list;
    }
  };
  const reading = (j.reading.sections||[]).map(s=>s.heading+': '+s.body).join('\n\n').slice(0,9000);
  await fixOne('contentQuiz', { stage:'Rebalancing the content questions to 3 / 3 / 2 / 2',
    user:`Reading:\n${reading}\n\nCurrent questions:\n${JSON.stringify(j.contentQuiz)}\n\nRewrite these into exactly 10 questions on this reading:
exactly ${COGNITIVE_MIX.Recall} Recall, ${COGNITIVE_MIX.Understanding} Understanding, ${COGNITIVE_MIX.Application} Application, ${COGNITIVE_MIX.Analysis} Analysis,
mixed through the set. The level must be true of the question, not just a label: Application and Analysis questions open with a
short workplace situation (a role, what happened) and ask what to do or why; Analysis asks them to compare, diagnose or judge. Keep the questions that already fit. Wrong options plausible.
Return JSON only: { "contentQuiz": [ { "stem":"", "o":["","","",""], "a":0, "why":"", "level":"Recall | Understanding | Application | Analysis" } ] }` },
    l=>mixOff(l));
  await fixOne('vocabQuiz', { stage:'Making each vocabulary term the right answer once',
    user:`Vocabulary list:\n${(j.vocabulary||[]).map(v=>v.term+' — '+v.def).join('\n')}\n\nWrite exactly 10 vocabulary questions, one per term above, in a new order.
Each gives the meaning or a use in context, and its right answer is that term written exactly as in the list, so each term is the right answer
exactly once. Wrong options are other terms from the list a student could confuse. Options similar in length; never refer to option letters.
Return JSON only: { "vocabQuiz": [ { "stem":"", "o":["","","",""], "a":0, "why":"" } ] }` },
    l=>vocabMiss(j, l));
}

/* ---------- long-running work ---------- */
/* In the product each of these is a job the server runs; the client shows
   its stage and elapsed time and can be left. One at a time here. */
let BUSY_T = null;
function busyStart(label){
  S.busy = true; S.busyLabel = label; S.busyStage = ''; S.busyAt = Date.now(); render();
  clearInterval(BUSY_T);
  BUSY_T = setInterval(()=>{ const e=$('[data-elapsed]'); if(e) e.textContent = Math.round((Date.now()-S.busyAt)/1000)+'s'; }, 1000);
}
function busyStage(t){ S.busyStage = t; const e=$('[data-stage]'); if(e) e.textContent = t; }
function busyEnd(){ clearInterval(BUSY_T); S.busy=false; S.busyLabel=''; S.busyStage=''; render(); }

/* Regeneration never overwrites an edit: it lands as a new revision and the
   teacher chooses which one the credential uses. */
function pushRevision(cred, kind, content){
  cred.revisions = cred.revisions || [];
  if(cred.content) cred.revisions.push({ at: cred.contentAt || cred.updatedAt || nowISO(),
    by: cred.lastEditedBy || (S.user&&S.user.name) || '', kind: cred.lastKind || 'generated',
    content: JSON.parse(JSON.stringify(cred.content)) });
  cred.lastKind = kind;
  cred.lastEditedBy = (S.user&&S.user.name) || '';
}

/* Gem 1.3 — after the first draft the teacher can revise or regenerate one
   component. One call rewrites only that part, in the shape it already has,
   with the rest of the week as context; the checks and repairs for that part
   run again, and the version it replaced is kept. */
const WEEK_PARTS_EDITABLE = {
  activating: { label:'Activating Strategy', keys:['activating'] },
  reading:    { label:'Teaching Strategy — reading and vocabulary', keys:['reading','vocabulary'] },
  assessment: { label:'Vocabulary and content assessments', keys:['vocabQuiz','contentQuiz'] },
  extending:  { label:'Extending and Refining', keys:['extending'] },
  summarizing:{ label:'Summarizing', keys:['summarizing'] },
  video:      { label:'Generated video', keys:['video'] },
  notes:      { label:'Teacher Notes', keys:['teacherNotes'] }
};
async function generatePart(credId, part, note){
  const cred = CRED(credId), spec = WEEK_PARTS_EDITABLE[part];
  if(!cred || !cred.content || !spec || S.busy) return;
  busyStart(`${part==='video' && !cred.content.video ? 'Writing' : 'Rewriting'} ${spec.label}`);
  try{
    const p = promptWeek(cred, usedBy(credId)[0] || null);
    if(part==='notes'){
      const j = JSON.parse(JSON.stringify(cred.content));
      await generateTeacherNotes(cred, j, p.system, note);
      if(!j.teacherNotes) throw new Error('Teacher Notes came back unreadable. Nothing was changed.');
      pushRevision(cred, 'edited', j); cred.content = j; cred.updatedAt = cred.contentAt = nowISO();
      toast(`Teacher Notes written · ${checksPassed(j)} of ${checksTotal(j)} checks passed`);
      busyEnd(); return;
    }
    const KEYS = part==='reading' && cred.content.videoOn ? spec.keys.concat(['video']) : spec.keys;
    const cur = cred.content;
    const keep = Object.fromEntries(Object.entries(cur).filter(([k])=>!KEYS.includes(k) && !['plan','keysSpread','teacherNotes','videoOn'].includes(k)));
    const old = Object.fromEntries(KEYS.map(k=>[k, cur[k]]));
    const raw = await callModel({ system: p.system, maxTokens: part==='reading'?12000:7000, user:
`${p.user}

THE REST OF THIS WEEK STAYS AS IT IS:
${JSON.stringify(keep).slice(0, 24000)}

THE PART BEING REWRITTEN, AS IT IS NOW:
${JSON.stringify(old).slice(0, 16000)}

Rewrite only ${KEYS.map(k=>'"'+k+'"').join(', ')}, keeping the same JSON shape, consistent with the rest of the week${part==='reading'?' (every vocabulary term must still appear in the reading, and the questions still have to be answerable from it)':''}.
${note ? `The teacher asks: ${note}` : 'Make it better against every rule above.'}
Return JSON only: { ${KEYS.map(k=>`"${k}": …`).join(', ')} }` });
    const out = extractJSON(raw);
    if(!out || KEYS.some(k=>out[k]==null)) throw new Error('That part came back unreadable. Nothing was changed.');
    const j = JSON.parse(JSON.stringify(cur));
    KEYS.forEach(k=>{ j[k] = out[k]; });
    if(part==='reading'){ for(let t=0;t<2 && readingWords(j)<900;t++){ busyStage('Lengthening the reading'); await lengthenReading(j, p.system, readingLevelOf(cred)); } }
    if(part==='video') j.videoOn = true;
    normalizeWeek(j);
    if(part==='reading'){ await repairVisuals(j, p.system); await repairVocabInReading(j, p.system); }
    if(part==='assessment' || part==='reading'){ await repairQuizzes(j, p.system); await repairDistractors(j, p.system); spreadKeys(j.vocabQuiz); spreadKeys(j.contentQuiz); }
    if(part==='extending') await repairDeliverable(j, p.system);
    if(part==='summarizing') await repairReflectionStrategy(j, p.system, cred);
    j.title = cred.title;
    pushRevision(cred, 'edited', j);
    cred.content = j; cred.updatedAt = cred.contentAt = nowISO();
    toast(`${esc(spec.label)} ${part==='video' && !cur.video ? 'written' : 'rewritten'} · ${checksPassed(j)} of ${checksTotal(j)} checks passed`);
  }catch(e){ toast(esc(e.message||'Could not rewrite that part')); }
  busyEnd();
}

/* =========================================================
   TEACHER NOTES — the third, teacher-only output
   ---------------------------------------------------------
   The Gem's self-check requires differentiation, career cluster
   alignment, NYS Next Generation and CDOS standards, AI video
   recommendations (when no instructor video is given) and
   additional lesson recommendations in every week. Its Output 2
   restrictions keep every one of them out of the planning form,
   and Output 1 has no place for them. Decided: they live here,
   after the plan, and are never shown to students.
   ========================================================= */

/* Part 5, Differentiation Engine: the seven groups every lesson supports. */
const DIFF_GROUPS = [
  'Students requiring additional support',
  'English Language Learners',
  'Advanced learners',
  'Students needing organizational support',
  'Students benefiting from visual learning',
  'Students benefiting from hands-on learning',
  'Students requiring scaffolded instruction'
];

function promptTeacherNotes(cred, j, note){
  const inp = cred.inputs || {};
  const prof = clusterProfile(clusterOf(cred.subCluster));
  const asks = [inp.differentiation && `Differentiation requests: ${inp.differentiation}`,
                inp.accessibility && `Accessibility requirements: ${inp.accessibility}`,
                inp.classroom && `Special classroom requirements: ${inp.classroom}`].filter(Boolean);
  const e = j.extending || {};
  return `Write the TEACHER NOTES for this week. They are for the teacher only: never shown to students, and
never part of the Credential Lesson or the planning form.

Week: "${j.title||cred.title}"${j.topic?` — ${j.topic}`:''}
Essential Question: ${j.essentialQuestion||''}
Opening scenario: ${String((j.activating||{}).scenario||'').slice(0,600)}
Reading sections: ${((j.reading||{}).sections||[]).map(s=>s.heading).join('; ')}
Vocabulary: ${(j.vocabulary||[]).map(v=>v.term).join(', ')}
Deliverable: ${e.task||''} (${e.tool||''})
Sub-cluster: ${cred.subCluster||'not set'}${prof?` · Career cluster: ${prof.name} (${prof.thinking})`:''}
${asks.length?`The teacher asked for:\n- ${asks.join('\n- ')}\n`:''}${inp.video?`The teacher supplies their own video: ${inp.video}. Return "videoRecs": [].\n`:''}${note?`The teacher asks: ${note}\n`:''}
CDOS standards (cite by exact code):
${standardsForPrompt('cdos')}

Return JSON only:
{
  "alignment": ["4-6 lines, each naming where the career cluster shows in THIS week — the scenario, the vocabulary, the examples, the questions, the deliverable, the workplace constraints, the student's decisions, the reflection. Specific, never generic."],
  "differentiation": [${DIFF_GROUPS.map(g=>`{ "group": "${g}", "strategy": "one or two sentences specific to this week's reading and deliverable; improves access, never lowers rigor" }`).join(',\n                      ')}],
  "cdos": [{ "code": "exact code from the CDOS list", "desc": "one line: how this week evidences it" }],
  "videoRecs": [{ "title": "the kind of video to find", "search": "the exact words to search for on YouTube or PBS LearningMedia", "shows": "what a good one shows and where it fits in the week" }],
  "recommendations": ["2-4 additional lesson recommendations: an extension, an industry or guest connection, a resource. Specific to this week."]
}
Give two or three CDOS codes and three video recommendations (none if the teacher supplies a video). Never invent a web address.`;
}

async function generateTeacherNotes(cred, j, system, note){
  busyStage('Writing the Teacher Notes');
  let out = null;
  try{ out = extractJSON(await callModel({ system, maxTokens: 3500, user: promptTeacherNotes(cred, j, note) })); }catch(e){ out = null; }
  if(!out || typeof out !== 'object') return;
  const arr = x => Array.isArray(x) ? x : [];
  const key = s => String(s||'').toLowerCase().replace(/[^a-z]/g,'');
  const diff = arr(out.differentiation);
  const inp = cred.inputs || {};
  j.teacherNotes = {
    alignment: arr(out.alignment).map(String).filter(x=>x.trim()),
    differentiation: DIFF_GROUPS.map((g,i)=>{
      const hit = diff.find(d=>d && key(d.group)===key(g)) || diff.find(d=>d && key(d.group).slice(0,10)===key(g).slice(0,10)) || diff[i] || {};
      return { group: g, strategy: String(hit.strategy||'').trim() };
    }),
    cdos: arr(out.cdos).map(s=>{ const k = standardByCode(s && s.code); return k && isCDOS(k) ? { code:k.code, desc:String(s.desc||k.desc) } : null; }).filter(Boolean).slice(0,4),
    videoRecs: inp.video ? [] : arr(out.videoRecs).filter(v=>v && (v.title||v.search)).slice(0,4)
      .map(v=>({ title:String(v.title||''), search:String(v.search||v.title||''), shows:String(v.shows||'') })),
    recommendations: arr(out.recommendations).map(String).filter(x=>x.trim()).slice(0,5),
    instructorVideo: inp.video || ''
  };
}

/* The self-check lines that Teacher Notes answer. */
function teacherNotesChecks(d){
  const t = (d && d.teacherNotes) || null;
  const diffN = t ? (t.differentiation||[]).filter(x=>String(x.strategy||'').trim().length>20).length : 0;
  return [
    { ok: diffN===DIFF_GROUPS.length, label:'Differentiation for all seven groups', detail: t ? `${diffN} of ${DIFF_GROUPS.length}` : 'no Teacher Notes' },
    { ok: !!t && (t.alignment||[]).length>=3, label:'Career cluster alignment written', detail: t ? `${(t.alignment||[]).length} points` : '' },
    { ok: !!t && (t.cdos||[]).length>=1, label:'CDOS standards cited', detail: t ? `${(t.cdos||[]).length}` : '' },
    { ok: !!t && ((t.videoRecs||[]).length>=2 || !!String(t.instructorVideo||'').trim()), label:'Video recommendations, or the teacher’s own video',
      detail: t && t.instructorVideo ? 'teacher video' : t ? `${(t.videoRecs||[]).length} recommendations` : '' },
    { ok: !!t && (t.recommendations||[]).length>=2, label:'Additional lesson recommendations', detail: t ? `${(t.recommendations||[]).length}` : '' }
  ];
}

/* A video address or title the teacher gave. Only http(s) links become links. */
function videoLink(v){
  const s = String(v||'').trim(); if(!s) return '';
  const url = (s.match(/https?:\/\/[^\s<>"']+/)||[])[0];
  const label = url ? (s.replace(url,'').replace(/[\s—:-]+$/,'').trim() || url) : s;
  return url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>` : esc(label);
}

    ${sec('Standards', `<b class="small">New York State Next Generation</b>

function teacherNotesDoc(c){
  const d = c.content, t = d.teacherNotes || {}, inp = c.inputs || {};
  const H = s => `<h3>${esc(s)}</h3>`, P = s => `<p>${esc(s)}</p>`, UL = a => `<ul>${(a||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  const html = [
    `<h2>Teacher Notes — ${esc(d.title||'')}</h2>`,
    H('Estimated weekly progression'),
    `<table border="1" cellpadding="4"><tr><th>Part</th>${c.pacing?'<th>Classroom day</th>':''}<th>Estimated time</th></tr>${WEEK_PARTS.map(p=>`<tr><td>${esc(p.name)}</td>${c.pacing?`<td>${esc(p.days)}</td>`:''}<td>about ${partMinutes(c,p.id)} min</td></tr>`).join('')}</table>`,
    H('Video'), inp.video ? P('Your video: '+inp.video) : '', (t.videoRecs||[]).length ? UL(t.videoRecs.map(v=>`${v.title} — search “${v.search}”. ${v.shows}`)) : '',
    H('Standards'), `<p><b>New York State Next Generation</b></p>`, ((d.plan||{}).standards||[]).length ? UL(d.plan.standards.map(s=>`${s.code} — ${s.desc}`)) : P('Waiting for the district’s documents.'),
    `<p><b>CDOS</b></p>`, UL((t.cdos||[]).map(s=>`${s.code} — ${s.desc}`)),
    H('Career cluster alignment'), UL(t.alignment),
    H('Differentiation'), (t.differentiation||[]).map(x=>`<p><b>${esc(x.group)}:</b> ${esc(x.strategy||'')}</p>`).join(''),
    H('Additional lesson recommendations'), UL(t.recommendations)
  ].join('\n');
  const tmp = document.createElement('div'); tmp.innerHTML = html.replace(/<\/(p|h\d|li|tr)>/g,'$&\n');
  return { html, text: tmp.innerText.replace(/\n{3,}/g,'\n\n').trim() };
}

        <select class="field" id="libsub" style="max-width:230px">
          <option value="">Any sub-cluster</option>
          ${subs.map(s=>`<option value="${esc(s)}" ${f.sub===s?'selected':''}>${esc(s)}</option>`).join('')}
        </select>
        <select class="field" id="libstatus" style="max-width:160px">
          <option value="">Any state</option>
          ${STATUSES.map(s=>`<option value="${s.id}" ${f.status===s.id?'selected':''}>${esc(s.label)}</option>`).join('')}

  const lv = LEVEL(c.level), st = STATUS(c.status);
  const have = credWeeks(c), want = lv.weeks;
  const uses = c.level==='nano' ? usedBy(c.id).length : 0;
  return `<button class="card pad" data-open="${c.id}" style="text-align:left;cursor:pointer;display:flex;flex-direction:column">
    <div class="spread wrap" style="gap:8px;align-items:flex-start">

      <span class="row gap" style="gap:5px">${c.live&&c.status!=='published'?'<span class="pill xs green">Live</span>':''}<span class="pill ${st.tone}">${esc(st.label)}</span></span>
    </div>
    <b class="mt12" style="font-size:15.5px;line-height:1.3">${esc(c.title || 'Untitled')}</b>
    ${c.subtitle?`<p class="xs muted mt8" style="line-height:1.55">${esc(c.subtitle)}</p>`:''}
    <div class="grow"></div>
    ${want>1?(()=>{ const w = weeksBeneath(c), wr = w.filter(k=>k.content).length;
      return `<div class="progress mt12"><i style="width:${pct(wr,want)}%"></i></div>
      <div class="xs muted2 mt8">${wr} of ${want} weeks written${have>wr?` · ${have-wr} placed, not written`:''}</div>`; })()
     :`<div class="xs muted2 mt12">${c.content?'Written':'Not written yet'}</div>`}
    <div class="row gap wrap mt8" style="gap:5px">
      ${c.subCluster?`<span class="pill xs">${esc(c.subCluster)}</span>`:''}

/* A nano is written from something. In the product the server extracts text
   from PDF and Word; the browser only ever handles plain text. */

  const c = S.create;
  const T=(k,l)=>`<button class="tab ${c.srcTab===k?'on':''}" data-csrctab="${k}">${esc(l)}</button>`;
  const sub = subCluster(c.subCluster);
  return `<div class="card pad-lg anim-up">
    <h2>What should it be written from?</h2>
    <p class="small muted mt8" style="max-width:72ch">${c.srcTab==='brief'
      ? `No document? Say what the week should teach and it is written from the field itself — or, if it
         is for a particular employer, from what you tell it about them.`
      : `A programme outline, a job description, a policy, an onboarding pack — whatever the partner
         actually sent. The generator quotes it rather than inventing around it.`}</p>
    <div class="tabs mt20">${T('file','Upload a file')}${T('paste','Paste text')}${T('brief','Write a brief')}</div>

    ${c.srcTab==='file'?`<div class="mt16">
      <div class="drop" id="cdrop">
        <div class="ico">${ic('doc')}</div>

    ${c.srcTab==='paste'?`<div class="mt16">

      <div class="xs muted mt8" data-cwords>${c.pasteText.trim()?wordCount(c.pasteText).toLocaleString()+' words':'Nothing pasted yet'}</div>
    </div>`:''}

    ${c.srcTab==='brief' ? briefForm(c.brief, sub) : ''}

    ${c.srcTab==='file' && c.fileSrc?`<div class="card pad mt16" style="background:var(--surface-2);box-shadow:none">
      <div class="spread wrap" style="gap:10px">
        <div><b class="small">${esc(c.fileSrc.name)}</b>
          <div class="xs muted mt4">${esc(c.fileSrc.kind)}${c.fileSrc.pages?` · ${c.fileSrc.pages} pages`:''} · ${wordCount(c.fileSrc.text).toLocaleString()} words read</div></div>

  </div>`;
}

const wordCount = t => String(t||'').trim().split(/\s+/).filter(Boolean).length;
/* The source is whatever the open tab holds — never something left behind
   on another tab. */
/* The district's Credentialing Curriculum Input Form, recognised from an
   upload or a paste (Gem 1.3–1.5). Its Course Content is what the week is
   written from; with none, the week is written from the form's other fields. */
function createForm(c){
  const src = c.srcTab==='file' ? c.fileSrc : c.srcTab==='paste' && wordCount(c.pasteText)>=10 ? { name:'Pasted text', text:c.pasteText } : null;
  if(!src || !looksLikeInputForm(src.text, src.name)) return null;
  return parseInputForm(src.text);
}
function formSource(f, c){
  if(f.content && wordCount(f.content) >= 20) return { name:'Course content from the Input Form', kind:'Text', text:f.content, inputForm:true };
  const topic = f.module || f.skillFocus || f.course || f.credential;
  if(!topic) return null;
  const sub = subCluster(c.subCluster);
  return { name:`${topic} — Input Form`, kind:'Brief', partner:false, inputForm:true, brief:{ topic },
    text:[`Topic: ${topic}`, f.skillFocus?`Key skill focus: ${f.skillFocus}`:'', sub?`Home sub-cluster: ${sub.name} (${clusterOf(sub.name)})\nWhat that sub-cluster covers:\n${sub.desc||''}\nCareers it leads to: ${(sub.careers||[]).slice(0,20).join(', ')}`:''].filter(Boolean).join('\n\n') };
}
function formCard(f){
  if(!f) return '';
  const got = Object.keys(INPUT_FORM_LABEL).filter(k=>f[k]!=null && String(f[k]).length);
  const blank = ['credential','course','module','week','content','skillFocus','scenarioIdea','deliverablePref','vocabulary','clusters'].filter(k=>!got.includes(k));
  return `<div class="callout tip mt16"><span class="ic">${ic('check')}</span><div>
    <b>District Input Form recognised.</b> ${got.length} field${got.length===1?'':'s'} filled in${blank.length?`; blank ones are generated: ${blank.map(k=>INPUT_FORM_LABEL[k]).join(', ')}`:''}.
    <div class="xs mt8" style="display:grid;gap:3px">${got.map(k=>`<div><b>${esc(INPUT_FORM_LABEL[k])}:</b> ${esc(Array.isArray(f[k])?f[k].join(', '):String(f[k]).slice(0,140))}${String(f[k]).length>140?'…':''}</div>`).join('')}</div>
  </div></div>`;
}
const INPUT_FORM_LABEL = Object.assign({ credential:'Credential name', course:'Course name', module:'Module name', week:'Week number', content:'Course content' }, INPUT_LABELS);

function createSourceNow(c){
  const f = createForm(c); if(f){ const fs = formSource(f, c); if(fs) return fs; }
  if(c.srcTab==='file')  return c.fileSrc || null;
  if(c.srcTab==='paste') return wordCount(c.pasteText) >= 40 ? { name:'Pasted text', kind:'Text', text:c.pasteText } : null;
  if(c.srcTab==='brief') return briefToSource(c.brief||{}, subCluster(c.subCluster));
  return null;
}

function bindCreate(){
  const c = S.create; if(!c) return;
  $$('[data-clevel]').forEach(b=> b.onclick = ()=>{ c.level = b.dataset.clevel; render(); });
  const nx=$('[data-cnext]'); if(nx) nx.onclick = ()=>{
    if(c.step===1){
      const s=$('#csub');
      c.subCluster = s?s.value:'';
      if((c.level==='nano'||c.level==='badge') && !c.subCluster) return;
    }
    c.step = Math.min(2, c.step+1); render();
  };
  const bk=$('[data-cback]'); if(bk) bk.onclick = ()=>{ c.step=Math.max(0,c.step-1); render(); };
  const sp=$('#csub');
  if(sp) sp.onchange = ()=>{
    c.subCluster = sp.value;
    const nb=$('[data-cnext]');
    if(nb && (c.level==='nano'||c.level==='badge')) nb.disabled = !c.subCluster;
  };
  const cx=$('[data-ccancel]'); if(cx) cx.onclick = ()=>{ S.create=null; S.view='library'; render(); };

  $$('[data-csrctab]').forEach(b=> b.onclick = ()=>{ c.srcTab=b.dataset.csrctab; render(); });
  const pick=$('[data-cpick]'), file=$('#cfile');
  if(pick && file) pick.onclick = ()=> file.click();
  const take = f => { toast('Reading '+esc(f.name)+'…'); return readSourceFile(f).then(src=>{
    c.fileSrc = src; render();
  }).catch(e=> toast(esc(e.message||'Could not read that file'))); };
  if(file) file.onchange = ()=>{ const f=file.files[0]; if(f) take(f); };
  bindDrop($('#cdrop'), take);
  const syncCreate = ()=>{ const btn=$('[data-ccreate]'); if(btn) btn.disabled = !createSourceNow(c); };
  const paste=$('#cpaste');
  if(paste) paste.oninput = ()=>{
    const was = !!createForm(c);
    c.pasteText = paste.value; syncCreate();
    if(was !== !!createForm(c)){ const pos = paste.selectionStart; render(); const np=$('#cpaste'); if(np){ np.focus(); np.setSelectionRange(pos,pos); } return; }
    const w=$('[data-cwords]'); if(w) w.textContent = c.pasteText.trim() ? wordCount(c.pasteText).toLocaleString()+' words'+(wordCount(c.pasteText)<40?' — at least 40 needed':'') : 'Nothing pasted yet';
    // Keep the recognised-form summary in step with the text as it grows (typed, not pasted in one go).
    const fc=$('[data-formcard]'); if(fc) fc.innerHTML = formCard(createForm(c));
  };
  bindBriefForm(document, c.brief || (c.brief={}), subCluster(c.subCluster), ()=> syncCreate());

  const cl=$('[data-cclearsrc]'); if(cl) cl.onclick = ()=>{ c.fileSrc=null; render(); };

  const t=$('#ctitle');     if(t) t.oninput = ()=>{ c.title=t.value;
    const btn=$('[data-ccreate]'); if(btn && c.level!=='nano') btn.disabled = !c.title.trim(); };
  if(t && c.level!=='nano') t.onkeydown = e=>{ if(e.key==='Enter'){ const b=$('[data-ccreate]'); if(b && !b.disabled) b.click(); } };
  const sub=$('#csubtitle');if(sub) sub.oninput = ()=>{ c.subtitle=sub.value; };

  const mk=$('[data-ccreate]');
  if(mk) mk.onclick = ()=>{
    const src = c.level==='nano' ? createSourceNow(c) : null;
    if(c.level==='nano' && !src) return;
    const typed = c.title.trim();
    const form = createForm(c);
    const rec = {
      id: uid(c.level), level:c.level, titleAuto: !typed,
      title: typed || (src ? (src.kind==='Brief' ? String(src.brief.topic||'').trim().replace(/^./,x=>x.toUpperCase()) : src.name==='Pasted text' ? (String(src.text).split('\n').map(x=>x.trim()).find(Boolean)||'Untitled').slice(0,70).replace(/[\s:,–—-]+$/,'') : src.name.replace(/\.[^.]+$/,'')) : 'Untitled'),
      subtitle:c.subtitle.trim(), subCluster:c.subCluster||null,
      strand: c.level==='nano' ? c.strand : null,
      status:'draft',
      source: src,
      strategies: c.level==='nano' ? { activating:'scenario', deliverable:'report', summarizing:'discussion' } : null,
      content:null, revisions:[],
      children: isContainer(c.level) ? [] : null,
      cumulative:null,
      createdBy:(S.user&&S.user.name)||'', createdAt:nowISO(), updatedAt:nowISO()
    };
    if(form){ applyInputForm(rec, form); if(!typed && (form.module||form.skillFocus)) rec.title = form.module || form.skillFocus; }
    S.creds.unshift(rec);
    if(c.placementId){ const pl=(S.placements||[]).find(x=>x.id===c.placementId); if(pl) pl.onboardingId = rec.id; }
    S.create=null;
    toast(c.level==='nano' ? 'Created. Choose the strategies, then write it.' : `${esc(rec.title)} created`);
    openCred(rec.id);
  };
}


/* =========================================================
   READING A FILE INTO SOURCE TEXT
   ---------------------------------------------------------
   In the product this is a server job: upload the file, the
   service extracts the text and returns
     { name, kind:'PDF'|'Word'|'Text', text, pages? }
   and that text is what the week is written from. This
   reference build does the same extraction in the browser so
   the whole route can be exercised end to end. A file that
   yields no text (a scanned PDF) is refused, never saved empty.
   ========================================================= */
const LIBS = {
  pdf:     'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfWork: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  docx:    'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js'
};
function loadScript(src){
  return new Promise((ok,no)=>{
    if(document.querySelector(`script[src="${src}"]`)) return ok();
    const t=document.createElement('script'); t.src=src; t.onload=()=>ok(); t.onerror=()=>no(new Error('Could not load the file reader'));
    document.head.appendChild(t);
  });
}
async function readSourceFile(f){
  const ext = (f.name.split('.').pop()||'').toLowerCase();
  if(f.size > 25*1024*1024) throw new Error('That file is over 25 MB');
  let text = '', kind = 'Text', pages;
  if(ext==='txt' || ext==='md'){
    text = await f.text();
  } else if(ext==='pdf'){
    kind = 'PDF';
    await loadScript(LIBS.pdf);
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfWork;
    const doc = await window.pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
    pages = doc.numPages; const out=[];
    for(let i=1;i<=doc.numPages;i++){
      const pg = await doc.getPage(i); const tc = await pg.getTextContent();
      out.push(tc.items.map(x=>x.str).join(' '));
    }
    text = out.join('\n\n');
  } else if(ext==='docx'){
    kind = 'Word';
    await loadScript(LIBS.docx);
    const r = await window.mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() });
    text = r.value || '';
  } else if(ext==='doc'){
    throw new Error('Old .doc files cannot be read — save it as .docx or PDF');
  } else {
    throw new Error('Use a PDF, a Word (.docx) or a text file');
  }
  text = text.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
  if(wordCount(text) < 40) throw new Error(`No readable text in ${f.name} — if it is a scan, paste the text instead`);
  return { name:f.name, kind, text, pages };
}
function bindDrop(el, take){
  if(!el) return;
  el.ondragover = e=>{ e.preventDefault(); el.classList.add('over'); };
  el.ondragleave = ()=> el.classList.remove('over');
  el.ondrop = e=>{ e.preventDefault(); el.classList.remove('over');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if(f) take(f); };
}

/* =========================================================
   THE BRIEF — for a week with no document
   ---------------------------------------------------------
   One route, not two. A teacher says what the week should
   teach; only if it is for a particular employer do the
   employer questions appear. A week on reading a micrometer
   never asks for a placement name.

   Two outcomes, and the generator treats them differently:
   without an employer it writes from the field and must not
   invent named forms or companies; with one it may use the
   organisation and details the teacher supplied, and nothing
   beyond them.
   ========================================================= */
const BRIEF_PARTNER_FIELDS = [
  ['org',     'The organisation', 2],
  ['role',    'What the placement is called', 2],
  ['does',    'What the student actually does there', 4],
  ['certify', 'What the employer wants to be able to rely on', 3]
];

function briefForm(b, sub){
  return `<div class="mt16">
    ${sub?`<div class="xs muted">Written for <b>${esc(sub.name)}</b> — its description and
      ${sub.careers.length} careers are used for examples.</div>`
     :`<div class="callout ex" style="margin-top:0"><span class="ic">${ic('flag')}</span>
       <div class="xs">There is no home sub-cluster, so there is nothing to ground this in.</div></div>`}

    <label class="lbl mt16">What should this week teach?</label>
    <input class="field" data-brief="topic" value="${esc(b.topic||'')}"
      placeholder="e.g. Reading a micrometer, or Running the scoreboard at a varsity game">

    <label class="lbl mt16">Anything it must cover <span class="muted2" style="font-weight:400">— optional</span></label>
    <textarea class="field" data-brief="more" rows="3"
      placeholder="Procedures, terms or constraints this week has to include">${esc(b.more||'')}</textarea>

    <label class="row gap mt20" style="gap:10px;align-items:flex-start;cursor:pointer">
      <input type="checkbox" data-briefpartner ${b.partner?'checked':''} style="margin-top:3px">
      <span><b class="small">This week is for a specific employer or placement</b>
        <span class="xs muted" style="display:block;margin-top:3px">For when a partner knows exactly how
          the job is done but has never written it down.</span></span>
    </label>

    ${b.partner?`<div class="card pad mt12" style="background:var(--surface-2);box-shadow:none">
      ${sub && (programMap(clusterOf(sub.name))||{partners:[]}).partners.length ? `<label class="lbl" for="bpartner">District partner <span class="muted2" style="font-weight:400">— from the Program Maps, or type another below</span></label>
        <select class="field mb16" id="bpartner" data-bpartner><option value="">Choose one…</option>${programMap(clusterOf(sub.name)).partners.map(x=>`<option ${b.org===x?'selected':''}>${esc(x)}</option>`).join('')}</select>` : ''}
      ${BRIEF_PARTNER_FIELDS.map(([k,l,r],n)=>`<label class="lbl ${n?'mt16':''}">${esc(l)}</label>
        <textarea class="field" data-brief="${k}" rows="${r}">${esc(b[k]||'')}</textarea>`).join('')}
    </div>`:''}
  </div>`;
}

/* Builds the source the generator reads. Null until there is enough to
   write from: a topic, a home sub-cluster, and — if it is for an employer —
   at least the organisation. */
function briefToSource(b, sub){
  const topic = String(b.topic||'').trim();
  if(topic.length < 4 || !sub) return null;
  if(b.partner && !String(b.org||'').trim()) return null;
  const parts = [
    `Topic: ${topic}`,
    b.more ? `Must cover:\n${b.more}` : '',
    b.partner ? [
      `Employer: ${b.org}`,
      b.role ? `Placement: ${b.role}` : '',
      b.does ? `What the student does there:\n${b.does}` : '',
      b.certify ? `What the employer wants to rely on:\n${b.certify}` : ''
    ].filter(Boolean).join('\n\n') : '',
    `Home sub-cluster: ${sub.name} (${clusterOf(sub.name)})`,
    `What that sub-cluster covers:\n${sub.desc||''}`,
    `Careers it leads to: ${(sub.careers||[]).slice(0,20).join(', ')}`
  ].filter(Boolean);
  return {
    name: b.partner ? `${topic} — ${String(b.org).trim()}` : `${topic} — ${sub.name}`,
    kind: 'Brief', partner: !!b.partner, brief: JSON.parse(JSON.stringify(b)),
    text: parts.join('\n\n')
  };
}

/* `redraw` is how the form shows or hides the employer questions: the page
   re-renders on the create screen, the modal re-opens inside a week. */
function bindBriefForm(root, b, sub, onChange, redraw){
  const sync = ()=> onChange(briefToSource(b, sub));
  $$('[data-brief]', root).forEach(f=> f.oninput = ()=>{ b[f.dataset.brief] = f.value; sync(); });
  const bp = $('[data-bpartner]', root);
  if(bp) bp.onchange = ()=>{ if(!bp.value) return; b.org = bp.value; const o=$('[data-brief="org"]', root); if(o) o.value = bp.value; sync(); };
  const pc = $('[data-briefpartner]', root);
  if(pc) pc.onchange = ()=>{ b.partner = pc.checked; sync(); (redraw||render)(); };
}

/* Header fields to the record's header, everything else to its inputs; a
   preferred deliverable that names a menu option selects it. */
function applyInputForm(rec, f){
  rec.header = Object.assign({}, rec.header||{});
  ['credential','course','module','week'].forEach(k=>{ if(f[k]!=null && String(f[k]).trim()) rec.header[k] = f[k]; });
  rec.inputs = Object.assign({}, rec.inputs||{});
  Object.keys(INPUT_LABELS).forEach(k=>{ if(f[k]!=null && String(f[k]).length) rec.inputs[k] = f[k]; });
  if(f.deliverablePref && rec.strategies){
    const want = String(f.deliverablePref).toLowerCase();
    const hit = MENUS.deliverable.find(o=> want.includes(o.name.toLowerCase()) || o.name.toLowerCase().includes(want));
    if(hit) rec.strategies.deliverable = hit.id;
  }
}

        <span class="xs muted2" style="align-self:center">${room} more needed</span>
      </div>`: ed && c.level==='badge' && !c.badgePlan ? `<div class="xs muted2 mt16">Plan the strands first — each new week then takes the next place in the plan.</div>`
        : room<=0 ? `<div class="callout tip mt16"><span class="ic">${ic('check')}</span>
        <div>All ${lv.count} ${ofName(lv.count)} are in place.</div></div>` : ''}
      ${repeatNote(c)}
    </div>

    ${lv.of!=='nano' && kids.length?`<div class="card pad-lg mt16"><h3>Every week, in order</h3>
      <p class="small muted mt4">The path a student walks through this ${lv.short.toLowerCase()}.</p>
      <div class="tree mt16">${pathTree(c)}</div></div>`:''}

    ${cumulativePanel(c)}
    ${S.busy ? '' : workflowPanel(c)}
  </div>`;
}

/* The nested path, container by container, down to the weeks. */
function pathTree(c){
  return childrenOf(c).map(k=>`<div>
    <button class="node" data-openkid="${k.id}"><span class="pill xs ${LEVEL(k.level).tone}">${esc(LEVEL(k.level).short)}</span>
      <span class="grow">${esc(k.title||'Untitled')}</span>
      ${k.level==='nano'?`<span class="xs muted2">${k.content?'written':'not written'}</span>`:''}</button>
    ${k.level!=='nano'&&(k.children||[]).length?`<div class="kids mt8">${pathTree(k)}</div>`:''}
  </div>`).join('');
}

/* What a student sees of a container: its weeks in order and the
   assessment that earns it. */
function studentContainer(c){

      ${((live.overview||{}).objectives||[]).length?`<b class="small mt16" style="display:block">What you will learn</b><ul class="num-list mt8">${live.overview.objectives.map(o=>`<li>${esc(o)}</li>`).join('')}</ul>`:''}

/* ---------- the cumulative assessment ---------- */
/* Without it a micro is five weeks in a folder and there is nothing to earn.
   It draws on the weeks it contains and teaches nothing new. */
function cumulativePanel(c){
  const weeks = weeksBeneath(c), written = weeks.filter(k=>k.content).length;
  const full = childrenOf(c).length >= LEVEL(c.level).count && weeks.length >= LEVEL(c.level).weeks;
  const ready = full && written === weeks.length;
  const cu = c.cumulative, stale = cumulativeStale(c);
  return `<div class="card pad-lg mt16">
    <div class="spread wrap" style="gap:10px">
      <h3>Cumulative assessment</h3>
      ${cu?`<span class="pill ${stale?'rose':'green'}">${stale?'Out of date':`${(cu.questions||[]).length} questions`}</span>`:''}
    </div>
    <p class="small muted mt4" style="max-width:72ch">What a student answers to earn the whole
      ${esc(LEVEL(c.level).label.toLowerCase())}, drawn across every week inside it. No new teaching —
      every question has to be answerable from content that is already here.</p>
    ${cu && stale?`<div class="callout ex mt16"><span class="ic">${ic('flag')}</span><div>A week inside was rewritten, added
      or removed after this was built. Rebuild it so it tests what is actually there.</div></div>`:''}
    ${cu?cumulativeQuiz(c, cu, false):''}
    ${editable(c)?`<div class="actbar">
      <span class="xs muted">${ready ? `Across all ${weeks.length} weeks`
        : !full ? 'Fill every place first — it is built from the finished set.'
        : `${weeks.length-written} week${weeks.length-written===1?' is':'s are'} not written yet`}</span>
      <button class="btn ${cu&&!stale?'':'primary'}" ${ready&&aiLive()&&!S.busy?'':'disabled'} data-ccumulative>
        ${cu?'Rebuild it':'Build it'} ${ic('arrowR')}</button>
    </div>`:''}
  </div>`;
}
function cumulativeQuiz(c, cu, student){
  if(student){
    const d = { vocabQuiz:[], contentQuiz:cu.questions||[] };
    const seed = S.previewSeed||7, key = `${c.id}|cum|${seed}`;
    const st = QUIZ[key] || (QUIZ[key] = { picks:{}, checked:false });
    const qs = randomisedQuiz(cu.questions||[], seed);
    const score = qs.filter((q,i)=>st.picks[i]===q.a).length;
    return `<div class="mt16" style="display:grid;gap:10px">${qs.map((q,i)=>`<div class="card pad" style="background:var(--surface-2);box-shadow:none">
      <b class="small">${i+1}. ${esc(q.stem||'')}</b>
      <div class="mt8" style="display:grid;gap:6px">${(q.o||[]).map((o,j)=>`<button class="qopt ${st.picks[i]===j?'sel':''} ${st.checked&&j===q.a?'right':''} ${st.checked&&st.picks[i]===j&&j!==q.a?'wrong':''}"
        data-qpick="${esc(key)}" data-q="${i}" data-o="${j}" ${st.checked?'disabled':''}><b>${String.fromCharCode(65+j)}</b> ${esc(o)}</button>`).join('')}</div>
      ${st.checked&&q.why?`<div class="xs muted2 mt8">${esc(q.why)}</div>`:''}</div>`).join('')}
      <div class="actbar"><span class="xs muted">${st.checked?`${score} of ${qs.length} right${qs.length-Object.keys(st.picks).length?` · ${qs.length-Object.keys(st.picks).length} not answered`:''}`:`${Object.keys(st.picks).length} of ${qs.length} answered`}</span>
        <button class="btn ${st.checked?'':'primary'}" data-qcheck="${esc(key)}">${st.checked?'Try again':'Check my answers'}</button></div></div>`;
  }
  const open = !!S.cumOpen;
  const list = open ? (cu.questions||[]) : (cu.questions||[]).slice(0,3);
  return `<div class="mt16" style="display:grid;gap:10px">
      ${list.map((q,i)=>`<div class="card pad" style="background:var(--surface-2);box-shadow:none">
        <b class="small">${i+1}. ${esc(q.stem||'')}</b>
        <div class="mt8" style="display:grid;gap:4px">${(q.o||[]).map((o,j)=>`<div class="xs ${j===q.a?'':'muted'}" style="${j===q.a?'color:var(--green);font-weight:600':''}">${String.fromCharCode(65+j)}. ${esc(o)}${j===q.a?' ✓':''}</div>`).join('')}</div>
        <div class="xs muted2 mt8">Draws on: ${esc(q.from||'')}</div>
      </div>`).join('')}
      ${(cu.questions||[]).length>3?`<button class="btn sm" data-cumtoggle style="justify-self:start">${open?'Show fewer':`Show all ${(cu.questions||[]).length}`}</button>`:''}
    </div>`;
}

      <button class="btn ${p?'':'primary'}" ${aiLive()&&c.subCluster&&!S.busy?'':'disabled'} data-cbadgeplan>${p?'Replan':'Plan the strands'} ${ic('arrowR')}</button></div>`:''}

function bindContainer(){
  { const cc = CRED(S.openId);
    const ow=$('[data-ovwrite]'); if(ow) ow.onclick = ()=> generateOverview(cc.id);

    if(oo) oo.onchange = ()=>{ cc.overview = Object.assign({}, cc.overview, { objectives: oo.value.split('\n').map(x=>x.trim()).filter(Boolean) }); cc.updatedAt=nowISO(); persist(); }; }

  const c = CRED(S.openId); if(!c) return;

  $$('[data-wstudent]').forEach(b=> b.onclick = ()=>{ S.studentView=!S.studentView; S.previewSeed = 1+Math.floor(Math.random()*900); render(); });
  $$('[data-qpick]').forEach(b=> b.onclick = ()=>{ const st=QUIZ[b.dataset.qpick]; if(!st||st.checked) return; st.picks[+b.dataset.q]=+b.dataset.o; render(); });
  $$('[data-qcheck]').forEach(b=> b.onclick = ()=>{ const st=QUIZ[b.dataset.qcheck]; if(!st) return; if(st.checked){st.checked=false;st.picks={};} else st.checked=true; render(); });
  const ct=$('[data-cumtoggle]'); if(ct) ct.onclick = ()=>{ S.cumOpen=!S.cumOpen; render(); };
  $$('[data-cmove]').forEach(b=> b.onclick = ()=>{
    const i = c.children.indexOf(b.dataset.cmove), j = i + (+b.dataset.dir);
    if(i<0||j<0||j>=c.children.length) return;
    [c.children[i], c.children[j]] = [c.children[j], c.children[i]];
    c.updatedAt = nowISO(); render();
  });
  $$('[data-cdrop]').forEach(b=> b.onclick = ()=>{
    c.children = c.children.filter(x=>x!==b.dataset.cdrop); c.updatedAt=nowISO();
    toast('Removed from this credential. It still exists, and anywhere else it is used is untouched.'); render();
  });
  const nk=$('[data-cnewkid]'); if(nk) nk.onclick = ()=> newChildFor(c);

  const cu=$('[data-ccumulative]'); if(cu) cu.onclick = ()=> generateCumulative(c.id);

        $$('[data-hdr]',m).forEach(f=>{ c.header = c.header||{}; const v=f.value.trim(); if(v) c.header[f.dataset.hdr] = f.dataset.hdr==='week' && /^\d+$/.test(v) ? +v : v; else delete c.header[f.dataset.hdr]; });

        render(); }; } });

}

/* A new child of the right level. A micro or badge gets a week; a macro gets
   a micro; a meta gets a macro. A new week inherits the home sub-cluster and
   source of the weeks beside it; in a planned badge it takes the next slot
   of the plan, as a brief. */
function newChildFor(c){
  const lv = LEVEL(c.level), childLevel = lv.of;
  const by = (S.user&&S.user.name)||'', at = nowISO();
  let rec;
  if(childLevel==='nano'){
    const sib = childrenOf(c).find(k=>k.source);
    const slot = c.level==='badge' ? nextBadgeSlot(c) : null;
    const sub = c.subCluster || (sib && sib.subCluster) || null;
    let source = sib ? sib.source : null, title = `Week ${(c.children||[]).length + 1}`;
    if(slot && sub){
      title = slot.title || title;
      source = briefToSource({ topic: `${slot.title}${slot.focus?' — '+slot.focus:''}`,
        more: slot.strand && slot.strand!=='Career & Technical' ? `Teach ${slot.strand} through this field.` : '' }, subCluster(sub));
    }
    rec = { id: uid('nano'), level:'nano', title, subtitle:'', subCluster: sub,
      strand: slot ? (slot.strand||'Career & Technical') : (c.level==='badge' ? nextStrandFor(c) : 'Career & Technical'),
      status:'draft', source, strategies:{ activating:'scenario', deliverable:'report', summarizing:'discussion' },
      content:null, revisions:[], children:null, cumulative:null, createdBy:by, createdAt:at, updatedAt:at };
  } else {
    const n = childrenOf(c).length + 1;
    rec = { id: uid(childLevel), level:childLevel, title:`${c.title} — ${LEVEL(childLevel).short} ${n}`, subtitle:'',
      subCluster: c.subCluster||null, strand:null, status:'draft', source:null, strategies:null,
      content:null, revisions:[], children:[], cumulative:null, createdBy:by, createdAt:at, updatedAt:at };
  }
  S.creds.unshift(rec);
  c.children.push(rec.id); c.updatedAt = nowISO();
  openCred(rec.id, c.id);
}
/* The first planned week whose title is not yet used inside the badge. */
function nextBadgeSlot(c){
  const p = c.badgePlan; if(!p || !(p.sequence||[]).length) return null;
  const have = childrenOf(c).map(k=>String(k.title||'').toLowerCase());
  return p.sequence.find(w=>!have.includes(String(w.title||'').toLowerCase())) || null;
}
/* Which strand the badge is shortest on, so the next week fills a real gap. */
function nextStrandFor(c){
  const plan = c.badgePlan; if(!plan) return 'Career & Technical';
  const have = {};
  childrenOf(c).forEach(k=>{ const s=k.strand||'Career & Technical'; have[s]=(have[s]||0)+1; });
  const short = (plan.strands||[]).map(s=>({ s:s.subject, gap:(s.weeks||0)-(have[s.subject]||0) }))
    .sort((a,b)=>b.gap-a.gap)[0];
  return short && short.gap>0 ? short.s : 'Career & Technical';
}

/* ---------- reuse ---------- */
function reusePicker(c){
  const taken = new Set(c.children||[]);
  const want = LEVEL(c.level).of;
  /* Never offer something that contains this credential: a loop. */
  const loops = x => x.id===c.id || (x.level!=='nano' && descendants(x).some(d=>d.id===c.id));
  const list = S.creds.filter(n=>n.level===want && !taken.has(n.id) && !loops(n))
    .sort((a,b)=> (a.subCluster===c.subCluster?0:1)-(b.subCluster===c.subCluster?0:1));
  return `<div>
    <h2>Reuse ${want==='nano'?'a week':'a '+esc(LEVEL(want).label.toLowerCase())}</h2>
    <p class="small muted mt8" style="max-width:62ch">Adding it here does not move it. It stays wherever
      else it is used, and an edit made anywhere changes it everywhere.</p>
    <input class="field mt16" id="reuseq" placeholder="Search">
    <div class="mt16" id="reuselist" style="display:grid;gap:9px;max-height:46vh;overflow:auto">
      ${list.length?list.map(n=>reuseRow(n)).join(''):`<div class="xs muted2">No other ${want==='nano'?'weeks':esc(LEVEL(want).label.toLowerCase())+'s'} have been built yet.</div>`}
    </div>
    <div class="actbar"><button class="btn" data-close>Close</button><div></div></div>
  </div>`;
}
function reuseRow(n){
  const uses = usedBy(n.id).length;
  return `<button class="card pad" data-reuse="${n.id}" data-title="${esc((n.title||'').toLowerCase())}"
    style="text-align:left;cursor:pointer;background:var(--surface-2);box-shadow:none">
    <div class="spread wrap" style="gap:10px">
      <div style="max-width:52ch"><b class="small">${esc(n.title||'Untitled')}</b>
        <div class="xs muted mt4">${esc(n.subCluster||'No sub-cluster')}${n.strand&&n.strand!=='Career & Technical'?' · '+esc(n.strand):''}
          ${uses?` · used in ${uses}`:''}</div></div>
      <span class="pill xs ${n.level==='nano'?(n.content?'green':''):''}">${n.level==='nano'?(n.content?'Written':'Not written'):`${credWeeks(n)} of ${LEVEL(n.level).weeks} weeks`}</span>
    </div></button>`;
}
function bindReuse(m, c){
  const q = $('#reuseq', m);
  if(q) q.oninput = ()=> $$('[data-reuse]', m).forEach(b=>{
    b.style.display = b.dataset.title.includes(q.value.toLowerCase()) ? '' : 'none'; });
  $$('[data-reuse]', m).forEach(b=> b.onclick = ()=>{
    if((c.children||[]).length >= LEVEL(c.level).count){ toast('It is already full'); return; }
    c.children.push(b.dataset.reuse); c.updatedAt = nowISO();
    const cl = $('[data-close]', m); if(cl) cl.click();
    toast('Added. It is still used everywhere else it was.');
    render();
  });
}

/* Gem Rule 8 — weeks in one credential should not repeat a workplace product
   or lean on the same vocabulary. A note, not a blocker: the teacher decides. */
function repeatNote(c){
  const ws = weeksBeneath(c).filter(k=>k.content);
  const notes = [];
  for(let i=0;i<ws.length;i++) for(let j=i+1;j<ws.length;j++){
    const a=ws[i], b=ws[j];
    const da = a.strategies && pickOf('deliverable',a.strategies.deliverable).name, db = b.strategies && pickOf('deliverable',b.strategies.deliverable).name;
    const ta = new Set((a.content.vocabulary||[]).map(v=>String(v.term||'').toLowerCase())), shared = (b.content.vocabulary||[]).filter(v=>ta.has(String(v.term||'').toLowerCase())).length;
    if(da && da===db) notes.push(`“${a.title}” and “${b.title}” both end in a ${da.toLowerCase()}`);
    if(shared>=3) notes.push(`“${a.title}” and “${b.title}” share ${shared} vocabulary terms`);
  }
  if(!notes.length) return '';
  return `<div class="callout why mt16"><span class="ic">${ic('bulb')}</span><div><b>Some weeks repeat each other.</b>
    The district asks for varied scenarios and products across a credential.<ul class="xs" style="margin:6px 0 0;padding-left:18px">${notes.slice(0,4).map(n=>`<li>${esc(n)}</li>`).join('')}</ul>
    ${notes.length>4?`<div class="xs mt4">and ${notes.length-4} more.</div>`:''}</div></div>`;
}

/* A credential above a week carries its own objectives and one mastery
   statement: what a student who holds it can do. Written from its weeks,
   editable, and part of what is reviewed and published. */
function overviewPanel(c){
  const o = c.overview||{}, ed = editable(c), have = weeksBeneath(c).filter(k=>k.content).length;
  if(!o.mastery && !(o.objectives||[]).length && !ed) return '';
  return `<div class="card pad-lg mt16">
    <div class="spread wrap" style="gap:10px"><h3>Overview</h3>
      ${ed && aiLive() && have ? `<button class="btn sm" data-ovwrite>${ic('spark')} ${o.mastery?'Rewrite':'Write'} from its weeks</button>` : ''}</div>
    <p class="small muted mt4" style="max-width:72ch">What a student who earns this ${esc(LEVEL(c.level).short.toLowerCase())} can do, and the objectives across its weeks.</p>
    ${ed ? `<label class="lbl mt16" for="ovm">Mastery statement</label><textarea class="field" id="ovm" rows="2" placeholder="${have?'Write it, or have it written from the weeks':'Add weeks first, or write it yourself'}">${esc(o.mastery||'')}</textarea>
      <label class="lbl mt12" for="ovo">Objectives <span class="muted2" style="font-weight:400">— one per line</span></label><textarea class="field" id="ovo" rows="${Math.max(3,(o.objectives||[]).length+1)}">${esc((o.objectives||[]).join('\n'))}</textarea>`
    : `${o.mastery?`<p class="contentbox mt12">${esc(o.mastery)}</p>`:''}${(o.objectives||[]).length?`<ul class="num-list mt12">${o.objectives.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}`}
  </div>`;
}
async function generateOverview(id){
  const c = CRED(id); if(!c || S.busy) return;
  const ws = weeksBeneath(c).filter(k=>k.content);
  busyStart('Writing the overview');
  try{
    const out = extractJSON(await callModel({ system: SYS_WEEK, maxTokens: 1500, user:
`These weeks make up the ${LEVEL(c.level).label} "${c.title}"${c.subtitle?` (${c.subtitle})`:''}:
${ws.map((k,i)=>`${i+1}. ${k.title} — ${k.content.essentialQuestion||''} — objectives: ${(k.content.objectives||[]).join('; ')}`).join('\n')}

Write the credential's overview: 4-6 objectives that span its weeks (each starting with a verb, no week-by-week list), and
one mastery statement completing "When you earn it, you can …" — specific enough for an employer to rely on.
Return JSON only: { "objectives": [""], "mastery": "" }` }));
    if(!out || !out.mastery) throw new Error('The overview came back unreadable. Nothing was changed.');
    c.overview = { objectives:(out.objectives||[]).map(String).slice(0,6), mastery:String(out.mastery).replace(/^when you earn it,? you can\s*/i,'') };
    c.updatedAt = nowISO(); toast('Overview written');
  }catch(e){ toast(esc(e.message||'Could not write the overview')); }
  busyEnd();
}

   chooses before generating, the Credential Lesson a student

function viewNano(c){
  const uses = usedBy(c.id);
  if(S.studentView) return studentNano(c);
  return `<div class="page narrow">
    <div class="spread wrap mb16" style="gap:10px">
      ${backButton()}
      ${uses.length?`<div class="row gap wrap" style="gap:6px">
        <span class="xs muted">Used in</span>

      </div>`:''}

/* Why the editing tools are missing, and the one way forward. */
function lockNote(c){
  if(!canEdit(c)) return `<div class="callout scen mt16"><span class="ic">${ic('users')}</span>
    <div>Built by ${esc(c.createdBy||'someone else')}. You can read it and reuse it in your own credentials;
      only they or an administrator can change it.</div></div>`;
  if(!isLocked(c)) return '';
  return `<div class="callout why mt16"><span class="ic">${ic('flag')}</span>
    <div>${c.status==='review'?'In review, so it is locked — a reviewer approves exactly what they read.'
      : c.status==='approved'?'Approved and locked.'
      : 'Published and locked. Starting changes makes a new draft; students keep this version until the next one is published.'}</div></div>`;
}

function busyPanel(){
  return `<div class="card pad-lg mt16 center" style="padding-top:56px;padding-bottom:56px">
    <div class="spinner" style="margin:0 auto"></div>
    <h2 class="mt20">${esc(S.busyLabel||'Working')}</h2>
    <p class="small muted mt8" data-stage>${esc(S.busyStage||'')}</p>

}

    </div>
    ${bad.length?`<div class="xs muted mt12">It cannot be submitted until every check passes. Regenerate, or fix it by hand in Edit content.</div>`:''}

/* The six kinds of visual support each look like what they are: a table is
   a table, steps are numbered, a checklist can be ticked. */
function visualBlock(v, path, student){
  const kind = VISUAL_KINDS.find(k=>k.id===v.kind) || { name: v.kind||'Note' };
  /* Models often repeat the kind in the title ("Key point: …"). */
  const title = String(v.title||'').replace(new RegExp('^\\s*'+kind.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*[:—-]\\s*','i'),'').trim();
  const tone = {mistake:'ex',safety:'ex',workplace:'scen',career:'scen',keypoint:'tip',practice:'tip'}[v.kind] || 'why';
  const icon = {mistake:'flag',safety:'flag',workplace:'users',career:'users',checklist:'list',steps:'list',flow:'list',decision:'target',practice:'check',quickcheck:'target'}[v.kind] || 'bulb';
  if(S.editing && !student) return `<div class="callout ${tone}"><span class="ic">${ic(icon)}</span>
    <div><b>${esc(kind.name)}</b>
      <div class="mt8">${ED(path+'.title', v.title, 1)}</div>
      ${v.body!=null || !(v.items||[]).length ? `<div class="mt8">${ED(path+'.body', v.body, 3)}</div>` : ''}
      ${(v.items||[]).length || VISUAL_USES[v.kind]!=='body' ? `<div class="mt8">${EDL(path+'.items', v.items)}
        ${v.kind==='table'?'<div class="xs mt4">Separate columns with | — the first line is the header.</div>':''}</div>` : ''}
    </div></div>`;
  const items = v.items||[];
  let inner = '';
  if(v.kind==='table' && items.length){
    const rows = items.map(r=>String(r).split('|').map(x=>x.trim()));
    inner = `<table class="vtable"><thead><tr>${rows[0].map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${rows.slice(1).map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  } else if(v.kind==='steps' && items.length){
    inner = `<ol class="vsteps">${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`;
  } else if(v.kind==='flow' && items.length){
    inner = `<div class="vflow">${items.map(x=>`<span>${esc(x)}</span>`).join('<i aria-hidden="true">→</i>')}</div>`;
  } else if(v.kind==='quickcheck'){
    return `<div class="callout why"><span class="ic">${ic(icon)}</span><div><b>${esc(kind.name)}${title?' — '+esc(title):''}</b>
      ${v.body?`<div class="mt4">${esc(v.body)}</div>`:''}
      ${items.length?`<details class="mt8"><summary class="xs" style="cursor:pointer">Check your answer</summary><div class="small mt4">${esc(items[0])}</div></details>`:''}
    </div></div>`;
  } else if(v.kind==='checklist' && items.length){
    inner = `<ul class="vcheck">${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  } else if(items.length){
    inner = `<ul style="margin:6px 0 0;padding-left:18px">${items.map(x=>`<li style="margin-bottom:3px">${esc(x)}</li>`).join('')}</ul>`;
  }
  return `<div class="callout ${tone}">
    <span class="ic">${ic(icon)}</span>
    <div><b>${esc(kind.name)}${title?' — '+esc(title):''}</b>
      ${v.body?`<div class="mt4">${esc(v.body)}</div>`:''}

}

/* ---------- the video, played ---------- */
/* What the product renders server-side as a video file: one slide per
   scene, a drawing that matches the scene's kind, the narration spoken
   over it. Here the browser's speech stands in for the rendered audio. */
function playVideo(v){
  if(!v || !(v.scenes||[]).length) return;
  let i = 0, paused = false, timer = null;
  const speak = window.speechSynthesis;
  const p = el('div','player');
  const art = k => ({
    sequence:'<i style="width:120px"></i><i style="width:120px;animation-delay:.25s"></i><i style="width:120px;animation-delay:.5s"></i><i style="width:120px;animation-delay:.75s"></i>',
    comparison:'<i style="width:260px;height:140px"></i><i style="width:260px;height:140px;animation-delay:.3s;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3)"></i>',
    'cause-and-effect':'<i style="width:180px"></i><i style="width:60px;height:6px;margin-top:29px;animation-delay:.3s"></i><i style="width:180px;animation-delay:.6s"></i>',
    'annotated-diagram':'<i style="width:300px;height:160px"></i><i style="width:120px;height:28px;animation-delay:.4s"></i><i style="width:90px;height:28px;animation-delay:.7s"></i>',
    'counter-example':'<i style="width:220px;background:rgba(194,102,31,.25);border-color:rgba(194,102,31,.6)"></i><i style="width:220px;animation-delay:.4s"></i>'
  }[k] || '<i style="width:280px"></i>');
  const draw = ()=>{
    const s = v.scenes[i];
    p.innerHTML = `<div class="bar"><i style="width:${Math.round((i+1)/v.scenes.length*100)}%"></i></div>
      <div class="stage"><div class="slide">
        <span class="kind">${esc(v.title||'')} · ${i+1} of ${v.scenes.length}</span>
        <div class="cap">${esc(s.caption||'')}</div>
        <div class="art">${art(s.kind)}</div>
        ${s.shows?`<div class="shows"><b>On screen</b> ${esc(s.shows)}</div>`:''}
      </div></div>
      <div class="sub">${esc(s.narration||'')}</div>
      <div class="ctl">
        <button class="btn sm" data-pprev ${i?'':'disabled'}>${ic('arrowL')} Back</button>
        <button class="btn sm" data-ppause>${paused?'Play':'Pause'}</button>
        <button class="btn sm" data-pnext>${i<v.scenes.length-1?'Next':'Finish'} ${ic('arrowR')}</button>
        <button class="btn sm" data-pclose>Close</button>
      </div>`;
    $('[data-pprev]',p).onclick = ()=> go(i-1);
    $('[data-pnext]',p).onclick = ()=> i<v.scenes.length-1 ? go(i+1) : close();
    $('[data-ppause]',p).onclick = ()=>{ paused=!paused; if(paused){ speak&&speak.cancel(); clearTimeout(timer); } else say(); draw(); };
    $('[data-pclose]',p).onclick = close;
  };
  const say = ()=>{
    clearTimeout(timer);
    const s = v.scenes[i], words = String(s.narration||'').split(/\s+/).length;
    const next = ()=>{ if(!paused) (i<v.scenes.length-1 ? go(i+1) : null); };
    if(speak && window.SpeechSynthesisUtterance){
      speak.cancel();
      const u = new SpeechSynthesisUtterance(s.narration||''); u.rate = 0.98;
      u.onend = ()=>{ timer = setTimeout(next, 700); };
      speak.speak(u);
      /* A browser with no voice installed never fires onend. */
      timer = setTimeout(next, Math.max(5000, words*420+2500));
    } else timer = setTimeout(next, Math.max(5000, words*400));
  };
  const go = n=>{ i = Math.max(0, Math.min(v.scenes.length-1, n)); draw(); if(!paused) say(); };
  const close = ()=>{ paused=true; clearTimeout(timer); speak&&speak.cancel(); p.remove(); document.removeEventListener('keydown', key); };
  const key = e=>{ if(e.key==='Escape') close(); if(e.key==='ArrowRight') go(i+1); if(e.key==='ArrowLeft') go(i-1); };
  document.addEventListener('keydown', key);
  document.body.appendChild(p); go(0);
}

/* Deterministic shuffle so a student's paper is reproducible from their id. */
function seeded(seed){ let x=(seed*1103515245+12345)&0x7fffffff;
  return ()=>{ x=(x*1103515245+12345)&0x7fffffff; return x/0x7fffffff; }; }
function shuffleWith(list, rnd){ const a=list.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function randomisedQuiz(list, seed){
  const rnd = seeded(seed);
  return shuffleWith(list||[], rnd).map(q=>{
    const pairs=(q.o||[]).map((text,i)=>({text, right:i===q.a}));
    // "All of the above" / "Both A and B" only make sense where they were written.
    const pinned = pairs.some(x=>isCrossRef(x.text));
    const mixed = pinned ? pairs : shuffleWith(pairs, rnd);
    return { ...q, o:mixed.map(x=>x.text), a:mixed.findIndex(x=>x.right) };
  });
}
